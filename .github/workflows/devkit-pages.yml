# Publishes the devkit to GitHub Pages on every push to main that touches the
# devkit or the game data (so live catalogs stay fresh). The page also hosts
# the single-file offline build (FantasyManagerDevkit.html) for download.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy devkit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'devkit_web/**'
      - 'game/data/**'
      - '.github/workflows/devkit-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
        working-directory: devkit_web
      - name: Test
        run: npm test
        working-directory: devkit_web
      - name: Bake catalogs from game data
        run: npm run bake
        working-directory: devkit_web
      - name: Build single-file offline app
        run: npm run build:offline
        working-directory: devkit_web
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r devkit_web/src/* _site/
          cp devkit_web/dist/FantasyManagerDevkit.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
