__fm.define('converters/wm_xml_to_fm.js', async () => {
// Whoremaster .girlsx/.rgirlsx → Fantasy Manager worker conversion.
// Port of parse_wm_girl_xml / convert_wm_to_fm_worker from the v6 editor,
// with two deliberate additions: unknown traits/skills are reported (not
// silently dropped) so the UI can offer a resolution step, and procedural
// templates keep their pack name instead of a random one (identifiable in
// the editor; spawned copies are named from names_list at runtime anyway).
const { ALL_SKILLS } = __fm.get('schemas/worker.schema.js');
const {
  WM_SKILL_MAPPING, WM_TRAIT_MAPPING, TRAIT_REQUIREMENTS, WM_RACE_TRAITS,
} = __fm.get('converters/wm_mappings.js');

const MAX_NAME_LENGTH = 15;

const UNIQUE_STAT_ATTRS = [
  'Charisma', 'Intelligence', 'Agility', 'Strength', 'Constitution',
  'Beauty', 'Confidence', 'Obedience', 'Spirit', 'Libido', 'Mana',
];

const UNIQUE_SKILL_ATTRS = [
  'NormalSex', 'Anal', 'BDSM', 'OralSex', 'Group', 'Lesbian',
  'Combat', 'Magic', 'Service', 'Strip', 'Handjob', 'TittySex',
  'Footjob', 'Beastiality', 'Medicine', 'Performance', 'Crafting',
  'Farming', 'Cooking', 'Herbalism', 'Brewing', 'AnimalHandling', 'Card', 'Sport',
];

function sanitizeFolderName(name) {
  return String(name || '')
    .toLowerCase()
    .replace(/[^\w\s-]/g, '')
    .replace(/\s+/g, '_');
}

function convertWMSkillValue(raw, scaleMax = 100) {
  if (scaleMax <= 0) return Math.min(100, Math.max(0, Math.trunc(raw)));
  return Math.min(100, Math.max(0, Math.round((raw * 100) / scaleMax)));
}

/** Parses one .girlsx / .rgirlsx XML string. Returns null when no <Girl>. */
function parseWMGirlXML(xmlString, filename) {
  const doc = new DOMParser().parseFromString(xmlString, 'text/xml');
  const girl = doc.querySelector('Girl');
  if (!girl) return null;

  const isRandom = String(filename || '').toLowerCase().endsWith('.rgirlsx');
  const xmlName = girl.getAttribute('Name') || 'Unknown';
  const baseName = girl.getAttribute('FirstName') || xmlName;

  let preferredName = baseName;
  if (baseName.length > MAX_NAME_LENGTH) {
    const firstSpace = baseName.indexOf(' ');
    if (firstSpace > 0) preferredName = baseName.slice(0, firstSpace);
  }

  const data = {
    name: preferredName,
    xml_name: xmlName,
    description: girl.getAttribute('Desc') || '',
    is_random: isRandom,
    stats: {},
    skills: {},
    traits: [],
  };

  if (isRandom) {
    for (const stat of girl.querySelectorAll('Stat')) {
      data.stats[stat.getAttribute('Name')] = {
        min: parseInt(stat.getAttribute('Min') || '0', 10),
        max: parseInt(stat.getAttribute('Max') || '100', 10),
      };
    }
    for (const skill of girl.querySelectorAll('Skill')) {
      data.skills[skill.getAttribute('Name')] = {
        min: parseInt(skill.getAttribute('Min') || '0', 10),
        max: parseInt(skill.getAttribute('Max') || '100', 10),
      };
    }
    for (const trait of girl.querySelectorAll('Trait')) {
      data.traits.push({
        name: trait.getAttribute('Name'),
        percent: parseInt(trait.getAttribute('Percent') || '100', 10),
      });
    }
  } else {
    // Attribute names are matched case-insensitively and canonicalized:
    // real browsers preserve XML attribute case but happy-dom lowercases it,
    // and WM packs in the wild are not always consistent either.
    const statCanonical = new Map(UNIQUE_STAT_ATTRS.map((a) => [a.toLowerCase(), a]));
    const skillCanonical = new Map(UNIQUE_SKILL_ATTRS.map((a) => [a.toLowerCase(), a]));
    const meta = new Set(['name', 'firstname', 'desc', 'askprice']);
    for (const rawAttr of girl.getAttributeNames()) {
      const lc = rawAttr.toLowerCase();
      if (meta.has(lc)) continue;
      const n = parseInt(girl.getAttribute(rawAttr), 10);
      if (Number.isNaN(n)) continue;
      if (statCanonical.has(lc)) data.stats[statCanonical.get(lc)] = n;
      else data.skills[skillCanonical.get(lc) || rawAttr] = n;
    }
    const askPrice = girl.getAttribute('AskPrice') ?? girl.getAttribute('askprice');
    if (askPrice && !Number.isNaN(parseInt(askPrice, 10))) {
      data.ask_price = parseInt(askPrice, 10);
    }
    for (const trait of girl.querySelectorAll('Trait')) {
      data.traits.push(trait.getAttribute('Name'));
    }
  }
  return data;
}

function comfortFromAskPrice(askPrice) {
  if (!askPrice || askPrice <= 0) return 3;
  if (askPrice <= 200) return 1;
  if (askPrice <= 400) return 2;
  if (askPrice <= 600) return 3;
  if (askPrice <= 800) return 4;
  return 5;
}

function randInt(rng, min, max) {
  return min + Math.floor(rng() * (max - min + 1));
}

/**
 * Converts parsed WM data to an FM worker.
 * Returns { worker, unknownTraits, unknownSkills }.
 */
function convertWMToFMWorker(wmData, {
  folderName,
  allSkills = ALL_SKILLS,
  skillScaleMax = 100,
  defaultCost = 1300,
  costRange = [1200, 1400],
  rng = Math.random,
  extraTraitMappings = {},
  extraSkillMappings = {},
} = {}) {
  const isRandom = !!wmData.is_random;
  const unknownTraits = [];
  const unknownSkills = [];

  const worker = {
    name: wmData.name || 'Unknown',
    folder: folderName,
    cost: isRandom ? randInt(rng, costRange[0], costRange[1]) : defaultCost,
    nsfw: true,
    unique: !isRandom,
    encounter_only: !isRandom,
    monster: false,
    procedural: isRandom,
    skills: {},
    names_list: isRandom ? 'western_female' : null,
    traits: ['Human'],
    description: wmData.description || '',
    gender: 'female',
    comfort_desired: comfortFromAskPrice(wmData.ask_price),
  };

  // Baseline like game unique workers: main skills 20-30, specialties 18-32.
  for (const skill of allSkills) {
    worker.skills[skill] = skill.startsWith('Specialty ')
      ? randInt(rng, 18, 32)
      : randInt(rng, 20, 30);
  }

  // Overwrite only skills WM actually specifies.
  const skillMap = { ...WM_SKILL_MAPPING, ...extraSkillMappings };
  for (const [wmSkill, value] of Object.entries(wmData.skills || {})) {
    let fmSkill = skillMap[wmSkill];
    if (!fmSkill) {
      fmSkill = allSkills.includes(wmSkill)
        ? wmSkill
        : wmSkill.charAt(0).toUpperCase() + wmSkill.slice(1);
    }
    if (!allSkills.includes(fmSkill)) {
      unknownSkills.push(wmSkill);
      continue;
    }
    const raw = typeof value === 'object' && value !== null
      ? Math.floor(((value.min || 0) + (value.max ?? 100)) / 2)
      : Math.trunc(value);
    worker.skills[fmSkill] = convertWMSkillValue(raw, skillScaleMax);
  }

  // Traits: requirements first, race traits replace Human, dedupe.
  const traitMap = { ...WM_TRAIT_MAPPING, ...extraTraitMappings };
  let traits = ['Human'];
  for (const t of wmData.traits || []) {
    const wmName = typeof t === 'object' && t !== null ? t.name : t;
    const fmTrait = traitMap[wmName];
    if (!fmTrait) {
      unknownTraits.push(wmName);
      continue;
    }
    if (traits.includes(fmTrait)) continue;
    const required = TRAIT_REQUIREMENTS[fmTrait];
    if (required && !traits.includes(required)) traits.push(required);
    if (WM_RACE_TRAITS.includes(fmTrait)) {
      traits = traits.filter((x) => x !== 'Human');
    }
    traits.push(fmTrait);
  }
  worker.traits = traits;

  return { worker, unknownTraits, unknownSkills };
}

return { sanitizeFolderName, convertWMSkillValue, parseWMGirlXML, convertWMToFMWorker };
});

__fm.define('converters/wm_image_rename.js', async () => {
// WM → FM image filename normalization. Port of rename_wm_images_in_folder
// from the v6 editor, with one improvement: trailing copy markers ("(2)",
// "_3") are stripped BEFORE applying the patterns, so "Nude_3.jpg" maps to
// "strip.jpg" instead of leaking through as "nude.jpg".
const { WM_IMAGE_RENAME_PATTERNS, WM_IMAGE_EXTENSIONS } = __fm.get('converters/wm_mappings.js');

function splitExt(filename) {
  const i = filename.lastIndexOf('.');
  if (i <= 0) return [filename, ''];
  return [filename.slice(0, i), filename.slice(i)];
}

function renameWMImageName(filename) {
  const [stem, ext] = splitExt(filename);
  let name = stem
    .replace(/\s*\(\d+\)\s*/g, '')
    .replace(/_+\d+$/, '');
  for (const [pattern, replacement] of WM_IMAGE_RENAME_PATTERNS) {
    name = name.replace(new RegExp(pattern, 'i'), replacement);
  }
  name = name.toLowerCase()
    .replace(/\s*\(\d+\)\s*/g, '')
    .replace(/_+\d+$/, '')
    .replace(/[_\s]+/g, '_')
    .replace(/^_+|_+$/g, '');
  return name + ext.toLowerCase();
}

/**
 * Plans renames for a list of filenames. Non-image files and files whose name
 * does not change are omitted. Collisions get " (1)", " (2)" suffixes —
 * matching the v6 behavior.
 */
function planRenames(filenames) {
  const plan = [];
  const taken = new Set(filenames.map((f) => f.toLowerCase()));
  for (const from of filenames) {
    const [, ext] = splitExt(from);
    if (!WM_IMAGE_EXTENSIONS.includes(ext.toLowerCase())) continue;
    let to = renameWMImageName(from);
    if (to === from) continue;
    if (taken.has(to.toLowerCase()) && to.toLowerCase() !== from.toLowerCase()) {
      const [stem, ext2] = splitExt(to);
      let counter = 1;
      while (taken.has(`${stem} (${counter})${ext2}`.toLowerCase())) counter += 1;
      to = `${stem} (${counter})${ext2}`;
    }
    taken.delete(from.toLowerCase());
    taken.add(to.toLowerCase());
    plan.push({ from, to });
  }
  return plan;
}

return { renameWMImageName, planRenames };
});

__fm.define('converters/wm_import_ui.js', async () => {
// Whoremaster batch importer UI: Source → Settings → Review → Import.
// Pure conversion logic lives in wm_xml_to_fm.js / wm_image_rename.js; this
// module only orchestrates the flow and the DOM.
const { parseWMGirlXML, convertWMToFMWorker, sanitizeFolderName } = __fm.get('converters/wm_xml_to_fm.js');
const { planRenames } = __fm.get('converters/wm_image_rename.js');
const { WM_IMAGE_EXTENSIONS } = __fm.get('converters/wm_mappings.js');
const { renderSummary } = __fm.get('lib/ui.js');
const { validateEntry } = __fm.get('lib/validator.js');
const { worker_schema } = __fm.get('schemas/worker.schema.js');

const RESOLUTIONS_KEY = 'fm_devkit_wm_trait_resolutions';

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function loadResolutions() {
  try { return JSON.parse(localStorage.getItem(RESOLUTIONS_KEY)) || {}; } catch { return {}; }
}

function saveResolutions(map) {
  localStorage.setItem(RESOLUTIONS_KEY, JSON.stringify(map));
}

/** Similarity score for suggestion ranking: shared-prefix + substring bonus. */
function similarity(a, b) {
  const x = a.toLowerCase();
  const y = b.toLowerCase();
  if (x === y) return 100;
  if (y.includes(x) || x.includes(y)) return 80;
  let prefix = 0;
  while (prefix < Math.min(x.length, y.length) && x[prefix] === y[prefix]) prefix += 1;
  const common = new Set([...x].filter((ch) => y.includes(ch))).size;
  return prefix * 8 + common;
}

function suggestTraits(wmTrait, allTraits, limit = 8) {
  return Array.from(allTraits)
    .map((t) => [t, similarity(wmTrait, t)])
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([t]) => t);
}

/**
 * runWMImporter(container, deps)
 * deps: { ctx() → validation ctx with catalogs, fs, hasGameFolder() → bool,
 *         getGameHandle() → FSA dir handle of <game>/game or null,
 *         modname, onDone() }
 */
function runWMImporter(container, deps) {
  const state = {
    sourceHandle: null,
    characters: [],       // { filename, wmData, folderName, imageDirName|null }
    imageDirs: new Map(), // dirName → handle
    settings: {
      outputFile: `workers/workers_${deps.modname}_wm.json`,
      skillScaleMax: 100,
      copyImages: true,
      renameImages: true,
      makeTraitStubs: true,
    },
    resolutions: loadResolutions(), // wmTrait → fm trait name | '__skip__'
    stubTraits: new Set(),
    rows: [],             // computed per-character review rows
  };

  function paintSource() {
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'Import from Whoremaster — 1 · Source'));
    wrap.appendChild(el('p', { class: 'muted' },
      'Pick the Whoremaster "Characters" folder. It should contain .girlsx / .rgirlsx ',
      'files and (optionally) one image folder per character.'));
    wrap.appendChild(el('button', {
      type: 'button', 'data-action': 'pick-source',
      onclick: async () => {
        if (!('showDirectoryPicker' in window)) {
          alert('Folder picking needs Chrome, Edge, or Brave.');
          return;
        }
        state.sourceHandle = await window.showDirectoryPicker({ mode: 'read' });
        await scanSource();
        paintSettings();
      },
    }, '📂 Pick Whoremaster folder'));
    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'back', onclick: () => deps.onDone(),
    }, 'Back'));
    wrap.appendChild(nav);
    container.appendChild(wrap);
  }

  async function scanSource() {
    state.characters = [];
    state.imageDirs = new Map();
    async function walk(dirHandle) {
      for await (const [name, entry] of dirHandle.entries()) {
        if (entry.kind === 'directory') {
          state.imageDirs.set(name, entry);
          await walk(entry);
        } else if (/\.r?girlsx$/i.test(name)) {
          try {
            const text = await (await entry.getFile()).text();
            const wmData = parseWMGirlXML(text, name);
            if (wmData) {
              state.characters.push({
                filename: name,
                wmData,
                folderName: sanitizeFolderName(wmData.name),
                imageDirName: null,
              });
            }
          } catch { /* unreadable file — skipped, reported via counts */ }
        }
      }
    }
    await walk(state.sourceHandle);
    // match image folders by WM convention: folder named after the XML Name
    for (const c of state.characters) {
      if (state.imageDirs.has(c.wmData.xml_name)) c.imageDirName = c.wmData.xml_name;
      else if (state.imageDirs.has(c.wmData.name)) c.imageDirName = c.wmData.name;
    }
  }

  function paintSettings() {
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'Import from Whoremaster — 2 · Settings'));
    const withImages = state.characters.filter((c) => c.imageDirName).length;
    wrap.appendChild(el('p', {},
      `Found ${state.characters.length} characters ` +
      `(${withImages} with an image folder).`));

    const fileRow = el('div', { class: 'field' });
    fileRow.appendChild(el('label', {}, 'Output file'));
    const fileInput = el('input', { type: 'text' });
    fileInput.value = state.settings.outputFile;
    fileInput.addEventListener('input', () => { state.settings.outputFile = fileInput.value; });
    fileRow.appendChild(fileInput);
    wrap.appendChild(fileRow);

    const scaleRow = el('div', { class: 'field' });
    scaleRow.appendChild(el('label', {}, 'WM skill scale'));
    const scaleSel = el('select');
    for (const v of ['100', '70']) scaleSel.appendChild(el('option', { value: v }, v));
    scaleSel.value = String(state.settings.skillScaleMax);
    scaleSel.addEventListener('change', () => {
      state.settings.skillScaleMax = parseInt(scaleSel.value, 10);
    });
    scaleRow.appendChild(scaleSel);
    wrap.appendChild(scaleRow);

    for (const [key, label] of [
      ['copyImages', 'Copy image folders into game/images/workers/'],
      ['renameImages', 'Rename images to FM conventions (Portrait→profile…)'],
      ['makeTraitStubs', 'Create stub traits for unknown WM traits you mark as "new"'],
    ]) {
      const row = el('div', { class: 'field' });
      row.appendChild(el('label', {}, label));
      const cb = el('input', { type: 'checkbox' });
      cb.checked = state.settings[key];
      cb.addEventListener('change', () => { state.settings[key] = cb.checked; });
      row.appendChild(cb);
      wrap.appendChild(row);
    }

    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'back', onclick: () => paintSource(),
    }, 'Back'));
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'next',
      onclick: () => { computeRows(); paintReview(); },
    }, 'Next'));
    wrap.appendChild(nav);
    container.appendChild(wrap);
  }

  function effectiveMappings() {
    const extra = {};
    for (const [wm, fm] of Object.entries(state.resolutions)) {
      if (fm && fm !== '__skip__') extra[wm] = fm;
    }
    return extra;
  }

  function computeRows() {
    const ctx = deps.ctx();
    const extra = effectiveMappings();
    state.rows = state.characters.map((c) => {
      const { worker, unknownTraits, unknownSkills } = convertWMToFMWorker(c.wmData, {
        folderName: c.folderName,
        skillScaleMax: state.settings.skillScaleMax,
        extraTraitMappings: extra,
      });
      const pendingTraits = unknownTraits.filter((t) => !(t in state.resolutions));
      return {
        character: c,
        worker,
        unknownTraits,
        pendingTraits,
        unknownSkills,
        include: true,
        duplicateName: ctx.catalogs.all_worker_names?.has(worker.name) || false,
        duplicateFolder: ctx.catalogs.all_worker_folders?.has(worker.folder) || false,
      };
    });
  }

  function paintReview() {
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'Import from Whoremaster — 3 · Review'));
    const pending = state.rows.reduce((n, r) => n + r.pendingTraits.length, 0);
    if (pending > 0) {
      wrap.appendChild(el('p', { class: 'muted' },
        `${pending} unknown WM trait(s) need a decision — click each ⚠ to resolve.`));
    }

    for (const row of state.rows) {
      const card = el('div', { class: 'object-item', 'data-character': row.worker.name });
      const head = el('div', { class: 'object-item-head' });
      const cb = el('input', { type: 'checkbox', 'data-action': 'include' });
      cb.checked = row.include;
      cb.addEventListener('change', () => { row.include = cb.checked; });
      head.appendChild(cb);
      head.appendChild(el('strong', {}, ` ${row.worker.name} `));
      head.appendChild(el('span', { class: 'muted' },
        row.worker.procedural ? 'procedural template' : 'unique worker'));
      card.appendChild(head);

      const info = el('div', { class: 'muted' },
        `folder: ${row.worker.folder}` +
        (row.character.imageDirName ? ` (images: ${row.character.imageDirName})` : ' (no image folder found)'));
      card.appendChild(info);
      if (row.duplicateName) {
        card.appendChild(el('div', { class: 'val-warning' },
          `⚠ a worker named "${row.worker.name}" already exists — importing will merge/replace it in your mod file`));
      }
      if (row.duplicateFolder) {
        card.appendChild(el('div', { class: 'val-warning' },
          `⚠ image folder "${row.worker.folder}" already exists in the game`));
      }

      const traitsRow = el('div', { class: 'chips' });
      for (const t of row.worker.traits) traitsRow.appendChild(el('span', { class: 'chip' }, t));
      for (const t of row.unknownTraits) {
        const resolved = state.resolutions[t];
        if (resolved === '__skip__') {
          traitsRow.appendChild(el('span', { class: 'chip muted' }, `${t} (skipped)`));
        } else if (!resolved) {
          traitsRow.appendChild(el('button', {
            type: 'button', class: 'chip chip-warn', 'data-unknown-trait': t,
            onclick: () => paintResolve(t),
          }, `⚠ ${t}`));
        }
      }
      card.appendChild(traitsRow);
      if (row.unknownSkills.length) {
        card.appendChild(el('div', { class: 'muted' },
          `unmapped WM skills (ignored): ${row.unknownSkills.join(', ')}`));
      }

      const details = el('details', { class: 'raw-json' });
      details.appendChild(el('summary', {}, 'Preview worker'));
      details.appendChild(renderSummary(row.worker));
      card.appendChild(details);
      wrap.appendChild(card);
    }

    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'back', onclick: () => paintSettings(),
    }, 'Back'));
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'import',
      onclick: () => doImport(),
    }, `Import ${state.rows.filter((r) => r.include).length} characters`));
    wrap.appendChild(nav);
    container.appendChild(wrap);
  }

  function paintResolve(wmTrait) {
    const ctx = deps.ctx();
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, `Resolve unknown trait: "${wmTrait}"`));
    wrap.appendChild(el('p', { class: 'muted' },
      'This Whoremaster trait has no Fantasy Manager equivalent yet. Map it to an ',
      'existing trait, create it as a new trait, or skip it. Your choice is ',
      'remembered for future imports.'));

    wrap.appendChild(el('h3', {}, 'Suggestions'));
    const sugg = el('div', { class: 'suggestion-row' });
    for (const t of suggestTraits(wmTrait, ctx.catalogs.all_traits || new Set())) {
      sugg.appendChild(el('button', {
        type: 'button', class: 'suggestion-chip', 'data-suggestion': t,
        onclick: () => resolveAs(wmTrait, t),
      }, t));
    }
    wrap.appendChild(sugg);

    wrap.appendChild(el('h3', {}, 'Or search all traits'));
    const search = el('input', { type: 'text', placeholder: 'Filter…' });
    const list = el('div', { class: 'suggestion-row' });
    const all = Array.from(ctx.catalogs.all_traits || []).sort();
    function paintList() {
      list.innerHTML = '';
      const q = search.value.toLowerCase();
      for (const t of all.filter((x) => x.toLowerCase().includes(q))) {
        list.appendChild(el('button', {
          type: 'button', class: 'suggestion-chip', 'data-trait': t,
          onclick: () => resolveAs(wmTrait, t),
        }, t));
      }
    }
    search.addEventListener('input', paintList);
    paintList();
    wrap.appendChild(search);
    wrap.appendChild(list);

    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'new-trait',
      onclick: () => {
        state.stubTraits.add(wmTrait);
        resolveAs(wmTrait, wmTrait);
      },
    }, `＋ Create "${wmTrait}" as a new trait`));
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'skip-trait',
      onclick: () => resolveAs(wmTrait, '__skip__'),
    }, 'Skip this trait'));
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'back',
      onclick: () => paintReview(),
    }, 'Back'));
    wrap.appendChild(nav);
    container.appendChild(wrap);
  }

  function resolveAs(wmTrait, fmTrait) {
    state.resolutions[wmTrait] = fmTrait;
    saveResolutions(state.resolutions);
    computeRows();
    paintReview();
  }

  function stubTraitEntry(name) {
    return {
      name,
      conflicts: [],
      removes_traits: [],
      modifiers: {
        skill_modifiers: {}, attribute_caps: {}, attribute_minimums: {},
        daily_effects: {}, earnings_multiplier: 0, libido_max: 0, libido_regeneration: 0,
      },
      description: 'Imported from Whoremaster — fill in the modifiers.',
      nsfw: false,
    };
  }

  async function copyImagesFor(row, log) {
    const gameHandle = deps.getGameHandle();
    if (!gameHandle || !row.character.imageDirName) return;
    const srcDir = state.imageDirs.get(row.character.imageDirName);
    if (!srcDir) return;

    const imagesDir = await gameHandle.getDirectoryHandle('images', { create: true });
    const workersDir = await imagesDir.getDirectoryHandle('workers', { create: true });
    const destDir = await workersDir.getDirectoryHandle(row.worker.folder, { create: true });

    const names = [];
    for await (const [name, entry] of srcDir.entries()) {
      if (entry.kind === 'file') names.push(name);
    }
    const renamed = state.settings.renameImages
      ? new Map(planRenames(names).map((p) => [p.from, p.to]))
      : new Map();

    let copied = 0;
    for (const name of names) {
      const ext = name.slice(name.lastIndexOf('.')).toLowerCase();
      if (!WM_IMAGE_EXTENSIONS.includes(ext)) continue;
      const target = renamed.get(name) || name.toLowerCase();
      try {
        const srcFile = await (await srcDir.getFileHandle(name)).getFile();
        const fh = await destDir.getFileHandle(target, { create: true });
        const w = await fh.createWritable();
        await w.write(await srcFile.arrayBuffer());
        await w.close();
        copied += 1;
      } catch (e) {
        log(`  ! failed to copy ${name}: ${e.message}`);
      }
    }
    log(`  images: ${copied} copied into images/workers/${row.worker.folder}/`);
  }

  async function doImport() {
    const rows = state.rows.filter((r) => r.include);
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'Import from Whoremaster — 4 · Import'));
    const logBox = el('pre', { class: 'json-preview', 'data-role': 'import-log' });
    wrap.appendChild(logBox);
    container.appendChild(wrap);
    const log = (line) => { logBox.textContent += `${line}\n`; };

    if (!deps.hasGameFolder()) {
      // No game folder: produce a single downloadable workers file.
      const workers = rows.map((r) => r.worker);
      const blob = new Blob([JSON.stringify(workers, null, 2) + '\n'], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = state.settings.outputFile.split('/').pop();
      a.click();
      log(`Downloaded ${a.download} with ${workers.length} workers.`);
      log('Select your game folder next time to also copy image folders automatically.');
    } else {
      for (const row of rows) {
        log(`${row.worker.name} → ${state.settings.outputFile}`);
        await deps.fs.mergeAndWrite(state.settings.outputFile, row.worker, { key: 'name' });
        if (state.settings.copyImages) await copyImagesFor(row, log);
      }
      if (state.settings.makeTraitStubs && state.stubTraits.size > 0) {
        const stubFile = `traits/traits_${deps.modname}_wm.json`;
        for (const name of state.stubTraits) {
          await deps.fs.mergeAndWrite(stubFile, stubTraitEntry(name), { key: 'name' });
          log(`stub trait "${name}" → ${stubFile}`);
        }
      }
      const errors = rows.reduce(
        (n, r) => n + validateEntry(r.worker, worker_schema, deps.ctx()).errors.length, 0,
      );
      log(`Done: ${rows.length} workers imported${errors ? ` (${errors} validation errors — open them in the editor)` : ''}.`);
    }
    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'done', onclick: () => deps.onDone(),
    }, 'Finish'));
    wrap.appendChild(nav);
  }

  paintSource();
}

return { suggestTraits, runWMImporter };
});

__fm.define('tools/gif_to_webm.js', async () => {
// GIF → WebM batch tool, powered by ffmpeg.wasm (lazy-loaded from jsDelivr on
// first use; ~31 MB once, then browser-cached). Same encoder settings as the
// v6 editor's convert_gif_to_webm. Single-threaded core on purpose: GitHub
// Pages sends no COOP/COEP headers, so SharedArrayBuffer (multithread) is
// unavailable there.
const FFMPEG_VERSION = '0.12.10';
const UTIL_VERSION = '0.12.1';
const CORE_VERSION = '0.12.6';
const CDN = 'https://cdn.jsdelivr.net/npm';

const FFMPEG_ARGS = (input, output) => [
  '-i', input, '-c:v', 'libvpx-vp9', '-pix_fmt', 'yuva420p',
  '-auto-alt-ref', '0', '-crf', '30', '-b:v', '0', '-an', output,
];

function webmNameFor(gifName) {
  return gifName.replace(/\.gif$/i, '.webm');
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`failed to load ${src}`));
    document.head.appendChild(s);
  });
}

let _ffmpeg = null;

async function getFFmpeg(onProgress) {
  if (_ffmpeg) return _ffmpeg;
  await loadScript(`${CDN}/@ffmpeg/ffmpeg@${FFMPEG_VERSION}/dist/umd/ffmpeg.js`);
  await loadScript(`${CDN}/@ffmpeg/util@${UTIL_VERSION}/dist/umd/index.js`);
  const { FFmpeg } = window.FFmpegWASM;
  const { toBlobURL } = window.FFmpegUtil;
  const ffmpeg = new FFmpeg();
  // The class worker runs as type:"module", where importScripts() always
  // throws and the fallback is `(await import(coreURL)).default` — so the
  // core MUST be the ESM build (the UMD core has no default export).
  const base = `${CDN}/@ffmpeg/core@${CORE_VERSION}/dist/esm`;
  onProgress('Downloading ffmpeg core (~31 MB, one time)…');
  // Workers must be same-origin, so every script the loader spawns is passed
  // through toBlobURL: the class worker (814.ffmpeg.js) and the core pair.
  await ffmpeg.load({
    classWorkerURL: await toBlobURL(
      `${CDN}/@ffmpeg/ffmpeg@${FFMPEG_VERSION}/dist/umd/814.ffmpeg.js`, 'text/javascript'),
    coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  _ffmpeg = ffmpeg;
  return ffmpeg;
}

/**
 * runGifToWebmTool(container, { onDone }) — pick a folder, convert every .gif
 * in it (recursively) to .webm written next to the original.
 */
function runGifToWebmTool(container, { onDone }) {
  let folderHandle = null;
  let gifs = []; // { name, path, dirHandle }
  let deleteOriginals = false;

  function paintPick() {
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'GIF → WebM converter'));
    wrap.appendChild(el('p', { class: 'muted' },
      'Ren\'Py does not animate GIFs — convert them to WebM. Pick a folder ',
      '(e.g. images/workers/<your_worker>/); every .gif inside is converted and ',
      'the .webm saved next to it. Needs an internet connection the first time ',
      'to download the converter (~31 MB, cached afterwards).'));
    wrap.appendChild(el('button', {
      type: 'button', 'data-action': 'pick-gif-folder',
      onclick: async () => {
        if (!('showDirectoryPicker' in window)) {
          alert('Folder picking needs Chrome, Edge, or Brave.');
          return;
        }
        folderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        gifs = [];
        await scan(folderHandle, '');
        paintQueue();
      },
    }, '📂 Pick a folder with GIFs'));
    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'back', onclick: () => onDone(),
    }, 'Back'));
    wrap.appendChild(nav);
    container.appendChild(wrap);
  }

  async function scan(dirHandle, prefix) {
    for await (const [name, entry] of dirHandle.entries()) {
      if (entry.kind === 'directory') await scan(entry, `${prefix}${name}/`);
      else if (/\.gif$/i.test(name)) gifs.push({ name, path: `${prefix}${name}`, dirHandle });
    }
  }

  function paintQueue() {
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'GIF → WebM converter'));
    if (gifs.length === 0) {
      wrap.appendChild(el('p', {}, 'No .gif files found in that folder.'));
    } else {
      wrap.appendChild(el('p', {}, `${gifs.length} GIF(s) found:`));
      const list = el('ul');
      for (const g of gifs) list.appendChild(el('li', {}, g.path));
      wrap.appendChild(list);
      const delRow = el('div', { class: 'field' });
      delRow.appendChild(el('label', {}, 'Delete original GIFs after converting'));
      const cb = el('input', { type: 'checkbox' });
      cb.addEventListener('change', () => { deleteOriginals = cb.checked; });
      delRow.appendChild(cb);
      wrap.appendChild(delRow);
    }
    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'back', onclick: () => paintPick(),
    }, 'Back'));
    if (gifs.length > 0) {
      nav.appendChild(el('button', {
        type: 'button', 'data-action': 'convert', onclick: () => convertAll(),
      }, `Convert ${gifs.length} GIF(s)`));
    }
    wrap.appendChild(nav);
    container.appendChild(wrap);
  }

  async function convertAll() {
    container.innerHTML = '';
    const wrap = el('div', { class: 'recipe-step' });
    wrap.appendChild(el('h2', {}, 'Converting…'));
    const logBox = el('pre', { class: 'json-preview', 'data-role': 'convert-log' });
    wrap.appendChild(logBox);
    container.appendChild(wrap);
    const log = (line) => {
      logBox.textContent += `${line}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    };

    let ffmpeg;
    try {
      ffmpeg = await getFFmpeg(log);
    } catch (e) {
      // ffmpeg.wasm sometimes rejects with plain strings, not Error objects
      log(`Could not load ffmpeg: ${String(e?.message ?? e)}`);
      log('Check your internet connection — or use the hosted devkit page, where this tool is most reliable.');
      finish(wrap);
      return;
    }

    let ok = 0;
    let failed = 0;
    for (const [i, g] of gifs.entries()) {
      log(`(${i + 1}/${gifs.length}) ${g.path}…`);
      try {
        const file = await (await g.dirHandle.getFileHandle(g.name)).getFile();
        await ffmpeg.writeFile('in.gif', new Uint8Array(await file.arrayBuffer()));
        await ffmpeg.exec(FFMPEG_ARGS('in.gif', 'out.webm'));
        const out = await ffmpeg.readFile('out.webm');
        if (!out || out.length === 0) throw new Error('empty output');
        const fh = await g.dirHandle.getFileHandle(webmNameFor(g.name), { create: true });
        const w = await fh.createWritable();
        await w.write(out);
        await w.close();
        if (deleteOriginals) await g.dirHandle.removeEntry(g.name);
        ok += 1;
        log(`  → ${webmNameFor(g.name)}`);
      } catch (e) {
        failed += 1;
        log(`  ! failed: ${String(e?.message ?? e)}`);
      }
    }
    log(`Done: ${ok} converted${failed ? `, ${failed} failed` : ''}.`);
    finish(wrap);
  }

  function finish(wrap) {
    const nav = el('div', { class: 'nav' });
    nav.appendChild(el('button', {
      type: 'button', 'data-action': 'done', onclick: () => onDone(),
    }, 'Finish'));
    wrap.appendChild(nav);
  }

  paintPick();
}

return { FFMPEG_ARGS, webmNameFor, runGifToWebmTool };
});

__fm.define('lib/catalog_loader.js', async () => {
const { RACE_TRAITS, ALL_SKILLS } = __fm.get('schemas/worker.schema.js');

function collectEventFlags(events, acc) {
  if (events == null) return;
  if (Array.isArray(events)) {
    for (const e of events) collectEventFlags(e, acc);
    return;
  }
  if (typeof events !== 'object') return;
  for (const [k, v] of Object.entries(events)) {
    if (k === 'event_flags' || k === 'required_flags' || k === 'excluded_flags') {
      if (v && typeof v === 'object') for (const flag of Object.keys(v)) acc.add(flag);
    } else {
      collectEventFlags(v, acc);
    }
  }
}

function buildCatalogs(sources) {
  const all_traits = new Set();
  const race_traits = new Set(RACE_TRAITS);
  const trait_meta = {};
  for (const file of sources.traits || []) {
    for (const t of file) {
      if (t && t.name) {
        all_traits.add(t.name);
        trait_meta[t.name] = {
          description: t.description || '',
          nsfw: !!t.nsfw,
        };
      }
    }
  }

  const all_items = new Set();
  const item_meta = {};
  for (const file of sources.items || []) {
    const items = file.items || file;
    if (Array.isArray(items)) {
      for (const i of items) {
        if (!i || !i.id) continue;
        all_items.add(i.id);
        item_meta[i.id] = {
          name: i.display_name || i.name || i.id,
          description: i.description || '',
          type: i.type || '',
        };
      }
    }
  }

  const all_buildings = new Set();
  const all_professions = new Set();
  const all_skills = new Set(ALL_SKILLS);
  const all_map_locations = new Set();
  const building_meta = {};
  const building_professions = {};
  const building_full = {};
  for (const file of sources.buildings || []) {
    // Game files wrap the array as { building_types: [...] }; raw arrays are
    // accepted too for fixtures/legacy.
    const list = Array.isArray(file) ? file : (file && file.building_types) || [];
    for (const b of list) {
      if (!b || !b.id) continue;
      all_buildings.add(b.id);
      building_full[b.id] = JSON.parse(JSON.stringify(b));
      for (const loc of b.allowed_map_locations || []) all_map_locations.add(loc);
      if (b.skill_name) all_skills.add(b.skill_name);
      building_meta[b.id] = {
        name: b.name || b.id,
        skill_name: b.skill_name || '',
        skill_description: b.skill_description || '',
      };
      const profs = [];
      for (const p of b.professions || []) {
        if (!p || !p.id) continue;
        all_professions.add(p.id);
        profs.push({ id: p.id, name: p.name || p.id, description: p.description || '' });
      }
      building_professions[b.id] = { name: b.name || b.id, professions: profs };
    }
  }

  const all_worker_names = new Set();
  const all_worker_folders = new Set();
  for (const file of sources.workers || []) {
    for (const w of file) {
      if (w.name) all_worker_names.add(w.name);
      if (w.folder) all_worker_folders.add(w.folder);
    }
  }

  const all_event_flags = new Set();
  collectEventFlags(sources.events || [], all_event_flags);
  collectEventFlags(sources.interactions || [], all_event_flags);

  return {
    all_traits, race_traits, all_items,
    all_buildings, all_professions, all_skills, all_map_locations,
    all_worker_names, all_worker_folders,
    all_event_flags,
    names_lists: new Set(),
    meta: { trait_meta, item_meta, building_meta, building_professions, building_full },
  };
}

return { buildCatalogs };
});

async function loadBundledCatalogs() {

  // catalog JSONs as window.__FM_BUNDLED_CATALOGS because fetch() does not
  // work over file://. The served version fetches them as usual.
  const inline = typeof window !== 'undefined' ? window.__FM_BUNDLED_CATALOGS : null;
  const names = ['all_traits', 'race_traits', 'all_items', 'all_buildings',
    'all_professions', 'all_skills', 'all_map_locations',
    'all_worker_names', 'all_worker_folders',
    'all_event_flags', 'names_lists', 'image_folders'];
  const out = {};
  for (const n of names) {
    if (inline) {
      out[n] = new Set(inline[n] || (n === 'race_traits' ? RACE_TRAITS : []));
      continue;
    }
    try {
      const r = await fetch(`./catalogs/${n}.json`);
      out[n] = new Set(await r.json());
    } catch {
      out[n] = new Set(n === 'race_traits' ? RACE_TRAITS : []);
    }
  }
  out.meta = {};
  for (const m of ['trait_meta', 'item_meta', 'building_meta',
    'building_professions', 'building_full']) {
    if (inline) {
      out.meta[m] = inline[m] || {};
      continue;
    }
    try {
      const r = await fetch(`./catalogs/${m}.json`);
      out.meta[m] = await r.json();
    } catch {
      out.meta[m] = {};

  }
  return out;

    type: 'button', class: 'recipe-btn', 'data-action': 'gif-to-webm',
    onclick: () => {
      app.innerHTML = '';
      runGifToWebmTool(app, { onDone: () => renderLanding() });
    },
  }, '🎞 GIF → WebM'));
  toolsGroup.appendChild(toolsRow);
  app.appendChild(toolsGroup);
}

// ---------- create with recipe ----------

async function startRecipe(type, recipe) {
  app.innerHTML = '';
  const out = await runRecipe(recipe, app, { modname, ctx: ctx() });
  if (out.edit) {
    openRecipeOutputInEditor(type, out);
    return;
  }
  const entries = entriesOf(type, out.json);
  let errorCount = 0;
  for (const e of entries) {
    errorCount += validateEntry(e, type.schema, ctx()).errors.length;
  }
  if (errorCount > 0 && !confirm(`${errorCount} validation errors. Save anyway?`)) {
    renderLanding();
    return;
  }
  await saveRecipeOutput(type, out);
  renderLanding();
}

/** "Fine-tune in editor" from a recipe review: load the built entry into the
 * type's section editor, then save through the same per-type dispatch. */
function openRecipeOutputInEditor(type, out) {
  const isExtension = type.id === 'daily_stories';
  const entry = isExtension ? out.json.story : out.json;
  app.innerHTML = '';
  runEditor({
    sections: type.sections,
    entry,
    schema: type.schema,
    container: app,
    ctx: ctx(),
    defaultFilename: out.filename,
    validate: (e) => validateEntry(e, type.schema, ctx()),
    onSave: async (updated, filename) => {
      const json = isExtension ? { ...out.json, story: updated } : updated;
      await saveRecipeOutput(type, { json, filename: filename || out.filename });
      renderLanding();
    },
  });
}

/** Entries to validate for a recipe/editor payload (handles arrays + extensions). */
function entriesOf(type, json) {
  if (type.id === 'daily_stories' && json && json.story) return [json.story];
  return Array.isArray(json) ? json : [json];
}

async function saveRecipeOutput(type, out) {
  const filename = out.filename;
  if (!rootHandle) {
    downloadJSON(standaloneFile(type, out.json), filename.split('/').pop());
    alert(
      `Downloaded ${filename.split('/').pop()}.\n\n` +
      `Drop it into your game's game/data/${filename.split('/').slice(0, -1).join('/')}/ folder, ` +
      `or click "📂 Select game folder" first to save directly next time.`,
    );
    return;
  }
  try {
    if (type.id === 'daily_stories') {
      await mergeDailyStoryExtension(fs, filename, out.json);
    } else {
      for (const entry of Array.isArray(out.json) ? out.json : [out.json]) {
        await fs.mergeAndWrite(filename, entry, { key: type.key, wrapper: type.wrapper });
      }
    }
    alert(`Saved to game/data/${filename}`);
  } catch (err) {
    alert(`Save failed: ${err.message}\n\nThe JSON will be downloaded instead.`);
    downloadJSON(standaloneFile(type, out.json), filename.split('/').pop());
  }
}

/** Wraps a recipe payload as a complete standalone file for download. */
function standaloneFile(type, json) {
  if (type.id === 'daily_stories') {
    return {
      daily_story_extensions: [{
        building_id: json.building_id,
        profession_id: json.profession_id,
        merge_mode: 'upsert',
        daily_stories: [json.story],
      }],
    };
  }
  const arr = Array.isArray(json) ? json : [json];
  if (type.wrapper) return { [type.wrapper]: arr };
  return arr;
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------- edit existing ----------

async function openExisting(type) {
  if (!rootHandle) {
    alert('Select your game folder first (top-right button).');
    return;
  }
  let files = [];
  try {
    files = (await fs.listDir(type.folder)).filter((f) => f.endsWith('.json'));
  } catch {}
  if (files.length === 0) {
    alert(`No JSON files found in game/data/${type.folder}/`);
    return;
  }
  pickFromList(`${type.title} — pick a file`, files, (file) => openFile(type, file));
}

async function openFile(type, file) {
  const relPath = `${type.folder}/${file}`;
  const data = await fs.readJSON(relPath);
  if (data == null) {
    alert(`Could not read ${relPath}.`);
    return;
  }

  if (type.id === 'daily_stories') {
    // Extension files hold entries, each with stories — flatten for picking.
    const flat = [];
    for (const entry of data.daily_story_extensions || []) {
      for (const story of entry.daily_stories || []) {
        flat.push({
          label: `${entry.building_id} / ${entry.profession_id} — ${story.id}`,
          entry, story,
        });
      }
    }
    if (flat.length === 0) {
      alert('No stories in this file.');
      return;
    }
    pickFromList(`${file} — pick a story`, flat.map((x) => x.label), (label) => {
      const found = flat.find((x) => x.label === label);
      editEntry(type, relPath, found.story, {
        building_id: found.entry.building_id,
        profession_id: found.entry.profession_id,
      });
    });
    return;
  }

  const list = type.wrapper ? data[type.wrapper] || [] : data;
  if (!Array.isArray(list) || list.length === 0) {
    alert('File has no entries (or is not in the expected format).');
    return;
  }
  const labels = list.map((e) => String(e?.[type.key] ?? '(unnamed)'));
  pickFromList(`${file} — pick an entry`, labels, (label) => {
    const entry = list.find((e) => String(e?.[type.key] ?? '(unnamed)') === label);
    editEntry(type, relPath, entry, null);
  });
}

function pickFromList(title, items, onPick) {
  app.innerHTML = '';
  const wrap = el('div', { class: 'picker' });
  wrap.appendChild(el('h2', {}, title));
  const list = el('div', { class: 'picker-list' });
  for (const item of items) {
    list.appendChild(el('button', {
      type: 'button', class: 'picker-item', 'data-item': item,
      onclick: () => onPick(item),
    }, item));
  }
  wrap.appendChild(list);
  const nav = el('div', { class: 'nav' });
  nav.appendChild(el('button', {
    type: 'button', 'data-action': 'back', onclick: () => renderLanding(),
  }, 'Back'));
  wrap.appendChild(nav);
  app.appendChild(wrap);
}

function editEntry(type, relPath, entry, extensionTarget) {
  app.innerHTML = '';
  runEditor({
    sections: type.sections,
    entry,
    schema: type.schema,
    container: app,
    ctx: ctx(),
    defaultFilename: relPath,
    validate: (e) => validateEntry(e, type.schema, ctx()),
    onSave: async (updated, filename) => {
      try {
        if (type.id === 'daily_stories') {
          await mergeDailyStoryExtension(fs, filename, {
            building_id: extensionTarget.building_id,
            profession_id: extensionTarget.profession_id,
            story: updated,
          });
        } else {
          await fs.mergeAndWrite(filename, updated, { key: type.key, wrapper: type.wrapper });
        }
        alert(`Saved to game/data/${filename}`);
        renderLanding();
      } catch (err) {
        alert(`Save failed: ${err.message}`);
      }
    },
  });
}

renderLanding();

return {  };
});

await __fm.boot();
</script>
