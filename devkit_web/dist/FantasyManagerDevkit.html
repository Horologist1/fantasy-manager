<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fantasy Manager Devkit</title>
  <style>
:root {
  --bg: #1b1b1f;
  --bg-elev: #25252c;
  --fg: #e8e8ee;
  --muted: #999;
  --accent: #7a5af8;
  --accent-fg: #fff;
  --error: #e25a5a;
  --border: #3a3a45;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: system-ui, sans-serif;
  background: var(--bg); color: var(--fg);
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border);
}
header h1 { margin: 0; font-size: 1.2rem; }
.header-actions { display: flex; gap: 0.5rem; align-items: center; }
.muted { color: var(--muted); font-size: 0.85rem; }
main { padding: 1.25rem; max-width: 960px; margin: 0 auto; }
footer { padding: 1rem; text-align: center; color: var(--muted); }

button {
  background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 4px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.95rem;
}
button:hover { filter: brightness(1.1); }
button[data-action="back"] { background: var(--bg-elev); color: var(--fg); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.tile {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
  padding: 1rem; cursor: pointer; transition: border-color 0.15s;
}
.tile:hover { border-color: var(--accent); }
.tile h3 { margin: 0 0 0.5rem 0; }
.tile p { margin: 0; color: var(--muted); font-size: 0.9rem; }

.recipe-step, .editor-section {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
  padding: 1.25rem; margin-top: 1rem;
}
.progress { color: var(--muted); margin-bottom: 0.75rem; }
.field { display: grid; grid-template-columns: 200px 1fr; gap: 0.75rem; margin: 0.5rem 0; align-items: center; }
.field label { color: var(--muted); }
.field input, .field textarea, .field select {
  background: var(--bg); color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: 0.4rem 0.6rem; font: inherit; width: 100%;
}
.field[aria-invalid="true"] input,
.field[aria-invalid="true"] textarea,
.field[aria-invalid="true"] select {
  border-color: var(--error);
}
.field-error { grid-column: 2 / -1; color: var(--error); font-size: 0.85rem; }

.chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.chip { background: var(--bg); border: 1px solid var(--border); padding: 0.2rem 0.5rem; border-radius: 12px; }
.chip-x { background: transparent; color: var(--muted); border: 0; padding: 0 0.2rem; cursor: pointer; }

.dict { border-collapse: collapse; width: 100%; }
.dict td { padding: 0.2rem 0.4rem; border-bottom: 1px solid var(--border); }

.tabs { display: flex; gap: 0.25rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
.tab { background: transparent; color: var(--fg); border: 0; padding: 0.5rem 0.75rem; cursor: pointer; }
.tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

.nav { display: flex; gap: 0.5rem; margin-top: 1rem; }
.json-preview {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 0.75rem; max-height: 400px; overflow: auto; font-size: 0.85rem;
}

.validation-panel { margin-top: 1rem; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
.val-error { color: var(--error); margin: 0.25rem 0; }
.val-warning { color: #d49a3a; margin: 0.25rem 0; }

.catalog-picker { display: flex; flex-direction: column; gap: 0.4rem; }
.catalog-picker-selected {
  min-height: 1.6rem; padding: 0.3rem 0.4rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center;
}
.catalog-picker-search { width: 100%; }
.catalog-picker-list {
  max-height: 240px; overflow-y: auto;
  display: flex; flex-wrap: wrap; gap: 0.25rem;
  padding: 0.4rem; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px;
}
.catalog-picker-item {
  background: var(--bg-elev); color: var(--fg);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0.2rem 0.5rem; font-size: 0.85rem; cursor: pointer;
}
.catalog-picker-item:hover { border-color: var(--accent); }
.catalog-picker-item.selected {
  background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
}

.string-suggestions { grid-column: 2 / -1; margin-top: 0.25rem; }
.string-suggestions .muted { display: block; font-size: 0.8rem; margin-bottom: 0.3rem; }
.suggestion-row {
  display: flex; flex-wrap: wrap; gap: 0.25rem;
  max-height: 120px; overflow-y: auto;
  padding: 0.3rem; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px;
}
.suggestion-chip {
  background: var(--bg-elev); color: var(--fg);
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0.15rem 0.45rem; font-size: 0.8rem; cursor: pointer;
}
.suggestion-chip:hover { border-color: var(--accent); }

.catalog-picker-info {
  padding: 0.5rem 0.6rem; min-height: 1.8rem;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  font-size: 0.88rem; line-height: 1.4;
}
.catalog-picker-info strong { color: var(--accent); }

.enum-option-description {
  grid-column: 2 / -1; margin-top: 0.3rem;
  padding: 0.4rem 0.5rem; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px;
  font-size: 0.85rem; color: var(--fg); line-height: 1.4;
}
.enum-option-description.muted-empty { color: var(--muted); }

/* ---- plan 2: landing groups, pickers, nested editors ---- */

.modname-row { margin-bottom: 1rem; }
.modname-row input {
  background: var(--bg-elev); color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: 0.35rem 0.6rem; font: inherit; margin-left: 0.4rem;
}

.banner {
  background: #3d3520; border: 1px solid #6b5d2e; color: #e8d48b;
  border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; font-size: 0.9rem;
}

.type-group {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.9rem 1.1rem; margin-bottom: 0.9rem;
}
.type-group h2 { margin: 0 0 0.15rem 0; font-size: 1.05rem; }
.type-group p { margin: 0 0 0.6rem 0; }
.type-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.recipe-btn { font-size: 0.85rem; }
.edit-btn {
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--border); font-size: 0.85rem;
}

.picker-list { display: flex; flex-direction: column; gap: 0.3rem; max-height: 60vh; overflow-y: auto; }
.picker-item {
  background: var(--bg-elev); color: var(--fg); text-align: left;
  border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem 0.75rem;
}
.picker-item:hover { border-color: var(--accent); }

.object-fields {
  border-left: 2px solid var(--border); padding-left: 0.75rem;
  display: flex; flex-direction: column;
}
.object-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.6rem 0.8rem; margin-bottom: 0.5rem;
}
.object-item-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0.4rem;
}
.add-key-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
.add-key-row input {
  background: var(--bg); color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;
}
.dict-editor .suggestion-row { margin-top: 0.4rem; }

/* ---- review summary ---- */
.summary-root { margin-bottom: 0.75rem; }
dl.summary {
  display: grid; grid-template-columns: minmax(140px, max-content) 1fr;
  gap: 0.3rem 1rem; margin: 0;
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.75rem 0.9rem;
}
dl.summary dt { color: var(--muted); text-transform: capitalize; }
dl.summary dd { margin: 0; }
dl.summary.summary-nested { border: 0; padding: 0.1rem 0 0.1rem 0.4rem; border-left: 2px solid var(--border); border-radius: 0; }
.summary-chips { display: inline-flex; flex-wrap: wrap; gap: 0.25rem; }
.summary-item {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0.4rem 0.6rem; margin-bottom: 0.35rem;
}
.summary-item-head { color: var(--accent); font-size: 0.8rem; margin-bottom: 0.2rem; }
details.raw-json { margin: 0.5rem 0 0.75rem 0; }
details.raw-json summary { color: var(--muted); cursor: pointer; font-size: 0.85rem; }

/* ---- WM importer ---- */
.chip-warn { background: #4a3a1a; border-color: #8a6d2e; color: #e8d48b; cursor: pointer; }

</style>

    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function wrapField(def, inner, errorNode) {
  const wrap = el('div', { class: 'field', 'data-field': def.id });
  if (def.label) wrap.appendChild(el('label', {}, def.label));
  wrap.appendChild(inner);
  wrap.appendChild(errorNode);
  return wrap;
}

function makeError() {
  return el('div', { class: 'field-error' });
}

function setErr(errEl, wrap, msg) {
  errEl.textContent = msg || '';
  if (msg) wrap.setAttribute('aria-invalid', 'true');
  else wrap.removeAttribute('aria-invalid');
}

function renderField(def, initial, onChange, ctx = null) {
  const type = Array.isArray(def.type) ? def.type[0] : def.type;
  switch (type) {
    case 'string':
    case 'longtext':
    case 'formula':
      return renderText(def, initial, onChange, ctx);
    case 'int':
    case 'float':
      return renderNumber(def, initial, onChange, type === 'int');
    case 'bool':
      return renderBool(def, initial, onChange);
    case 'enum':
      return renderEnum(def, initial, onChange);
    case 'list_of_strings':
      return renderListOfStrings(def, initial, onChange, ctx);
    case 'dict_of_numbers':
      return renderDictOfNumbers(def, initial, onChange, ctx);
    case 'dict_of_bools':
      return renderDictOfBools(def, initial, onChange, ctx);
    case 'object':
      return renderObject(def, initial, onChange, ctx);
    case 'list_of_objects':
      return renderListOfObjects(def, initial, onChange, ctx);
    case 'dict_of_objects':
      return renderDictOfObjects(def, initial, onChange, ctx);
    default:
      return renderText(def, initial == null ? '' : String(initial), onChange, ctx);
  }
}

// Shared "add key" row: text input + button, with optional clickable
// suggestions from ctx.catalogs[def.key_catalog].
function makeAddKeyRow(def, ctx, existing, onAdd) {
  const row = el('div', { class: 'add-key-row' });
  const input = el('input', { type: 'text', 'data-role': 'add-key', placeholder: 'Add key…' });
  const btn = el('button', { type: 'button', 'data-action': 'add-key' }, '+ Add');
  const commit = () => {
    const k = input.value.trim();
    if (!k || existing().includes(k)) return;
    input.value = '';
    onAdd(k);
  };
  btn.addEventListener('click', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
  });
  row.appendChild(input);
  row.appendChild(btn);

  const wrap = el('div');
  wrap.appendChild(row);
  if (def.key_catalog && ctx?.catalogs?.[def.key_catalog]) {
    const sugg = el('div', { class: 'suggestion-row' });
    for (const item of Array.from(ctx.catalogs[def.key_catalog]).sort()) {
      sugg.appendChild(el('button', {
        type: 'button',
        class: 'suggestion-chip',
        'data-suggestion': item,
        onclick: () => { if (!existing().includes(item)) onAdd(item); },
      }, item));
    }
    wrap.appendChild(sugg);
  }
  return wrap;
}

function renderText(def, initial, onChange, ctx = null) {
  const errEl = makeError();
  const input = def.type === 'longtext'
    ? el('textarea', { rows: 4 })
    : el('input', { type: 'text' });
  if (initial != null) input.value = initial;
  input.addEventListener('input', () => onChange(input.value === '' ? null : input.value));
  if (def.hint) {
    input.setAttribute('placeholder', def.hint);
    input.setAttribute('title', def.hint);
  }
  const wrap = wrapField(def, input, errEl);

  // Catalog-backed string: show clickable suggestion chips below the input so
  // the user can browse instead of guessing names from memory.
  if (def.catalog && ctx?.catalogs?.[def.catalog]) {
    const items = Array.from(ctx.catalogs[def.catalog]).sort();
    if (items.length > 0) {
      const block = el('div', { class: 'string-suggestions', 'data-role': 'suggestions' });
      block.appendChild(el('span', { class: 'muted' },
        `Available (${items.length}) — click to use:`));
      const row = el('div', { class: 'suggestion-row' });
      for (const item of items) {
        const chip = el('button', {
          type: 'button',
          class: 'suggestion-chip',
          'data-suggestion': item,
          onclick: () => {
            input.value = item;
            onChange(item);
          },
        }, item);
        row.appendChild(chip);
      }
      block.appendChild(row);
      wrap.appendChild(block);
    }
  }

  return {
    element: wrap,
    getValue: () => (input.value === '' ? null : input.value),
    setValue: (v) => (input.value = v == null ? '' : String(v)),
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderNumber(def, initial, onChange, isInt) {
  const errEl = makeError();
  const input = el('input', { type: 'number' });
  input.value = initial == null ? '' : String(initial);
  const parse = (s) => {
    if (s === '') return 0;
    const n = isInt ? parseInt(s, 10) : parseFloat(s);
    return Number.isNaN(n) ? 0 : n;
  };
  input.addEventListener('input', () => onChange(parse(input.value)));
  const wrap = wrapField(def, input, errEl);
  return {
    element: wrap,
    getValue: () => parse(input.value),
    setValue: (v) => (input.value = v == null ? '' : String(isInt ? Math.trunc(v) : v)),
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderBool(def, initial, onChange) {
  const errEl = makeError();
  const input = el('input', { type: 'checkbox' });
  input.checked = !!initial;
  input.addEventListener('change', () => onChange(input.checked));
  input.addEventListener('click', () => onChange(input.checked));
  const wrap = wrapField(def, input, errEl);
  return {
    element: wrap,
    getValue: () => input.checked,
    setValue: (v) => (input.checked = !!v),
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderEnum(def, initial, onChange) {
  const errEl = makeError();
  const sel = el('select');
  for (const opt of def.options || []) sel.appendChild(el('option', { value: opt }, opt));
  if (initial) sel.value = initial;

  const descs = def.option_descriptions || null;
  const descEl = descs
    ? el('div', { class: 'enum-option-description', 'data-role': 'option-description' })
    : null;

  function paintDesc() {
    if (!descEl) return;
    const v = sel.value;
    const text = descs[v];
    if (text) {
      descEl.textContent = text;
      descEl.classList.remove('muted-empty');
    } else {
      descEl.textContent = 'Pick an option to see what it does.';
      descEl.classList.add('muted-empty');
    }
  }

  sel.addEventListener('change', () => {
    onChange(sel.value);
    paintDesc();
  });

  const wrap = wrapField(def, sel, errEl);
  if (descEl) {
    wrap.appendChild(descEl);
    paintDesc();
  }

  return {
    element: wrap,
    getValue: () => sel.value,
    setValue: (v) => {
      sel.value = v == null ? '' : v;
      paintDesc();
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderListOfStrings(def, initial, onChange, ctx) {
  // Catalog-backed: render a visible browsable picker so the user can discover
  // valid values instead of guessing them from memory. Without a catalog we
  // fall back to a free-text chip input.
  if (def.catalog && ctx?.catalogs?.[def.catalog]) {
    const meta = ctx.meta?.[`${catalogToMetaKey(def.catalog)}`] || null;
    return renderCatalogPicker(def, initial, ctx.catalogs[def.catalog], onChange, meta);
  }

  const errEl = makeError();
  let values = Array.isArray(initial) ? [...initial] : [];
  const container = el('div', { class: 'chips' });
  const input = el('input', { type: 'text', placeholder: 'Add…' });

  function paint() {
    container.innerHTML = '';
    for (const v of values) {
      const chip = el('span', { class: 'chip' }, v, ' ');
      const x = el('button', { type: 'button', class: 'chip-x' }, '×');
      x.addEventListener('click', () => {
        values = values.filter((y) => y !== v);
        paint();
        onChange(values);
      });
      chip.appendChild(x);
      container.appendChild(chip);
    }
    container.appendChild(input);
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) {
      e.preventDefault();
      values.push(input.value.trim());
      input.value = '';
      paint();
      onChange(values);
    }
  });

  paint();
  const wrap = wrapField(def, container, errEl);
  return {
    element: wrap,
    getValue: () => [...values],
    setValue: (v) => {
      values = Array.isArray(v) ? [...v] : [];
      paint();
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function catalogToMetaKey(catalogName) {
  // Maps e.g. "all_traits" → "trait_meta", "all_items" → "item_meta",
  // "all_buildings" → "building_meta". Falls back to <name>_meta otherwise.
  const known = {
    all_traits: 'trait_meta',
    race_traits: 'trait_meta',
    all_items: 'item_meta',
    all_buildings: 'building_meta',
  };
  return known[catalogName] || `${catalogName}_meta`;
}

function metaDescription(meta, item) {
  if (!meta) return '';
  const m = meta[item];
  if (!m) return '';
  if (typeof m === 'string') return m;
  return m.description || m.name || '';
}

function renderCatalogPicker(def, initial, catalogSet, onChange, meta = null) {
  const errEl = makeError();
  let values = Array.isArray(initial) ? [...initial] : [];
  let filterText = '';
  let focusedItem = null;
  const items = Array.from(catalogSet).sort();

  const root = el('div', { class: 'catalog-picker' });
  const selectedRow = el('div', { class: 'catalog-picker-selected', 'data-role': 'selected' });
  const search = el('input', {
    type: 'text',
    class: 'catalog-picker-search',
    'data-role': 'search',
    placeholder: `Search ${items.length} options…`,
  });
  const list = el('div', { class: 'catalog-picker-list', 'data-role': 'list' });
  const info = el('div', { class: 'catalog-picker-info', 'data-role': 'info' });

  function paintSelected() {
    selectedRow.innerHTML = '';
    if (values.length === 0) {
      selectedRow.appendChild(el('span', { class: 'muted' }, 'None selected'));
      return;
    }
    for (const v of values) {
      const chip = el('span', { class: 'chip' }, v, ' ');
      const desc = metaDescription(meta, v);
      if (desc) chip.setAttribute('title', desc);
      const x = el('button', { type: 'button', class: 'chip-x' }, '×');
      x.addEventListener('click', () => {
        values = values.filter((y) => y !== v);
        paintSelected();
        paintList();
        paintInfo();
        onChange(values);
      });
      chip.appendChild(x);
      selectedRow.appendChild(chip);
    }
  }

  function paintList() {
    list.innerHTML = '';
    const lc = filterText.toLowerCase();
    const filtered = lc ? items.filter((i) => i.toLowerCase().includes(lc)) : items;
    if (filtered.length === 0) {
      list.appendChild(el('div', { class: 'muted' }, 'No matches.'));
      return;
    }
    for (const item of filtered) {
      const isSelected = values.includes(item);
      const desc = metaDescription(meta, item);
      const itemEl = el('button', {
        type: 'button',
        class: isSelected ? 'catalog-picker-item selected' : 'catalog-picker-item',
        'data-item': item,
        'aria-pressed': isSelected ? 'true' : 'false',
        title: desc || undefined,
        onclick: () => {
          if (values.includes(item)) values = values.filter((x) => x !== item);
          else values = [...values, item];
          focusedItem = item;
          paintSelected();
          paintList();
          paintInfo();
          onChange(values);
        },
      }, item);
      itemEl.addEventListener('mouseenter', () => {
        focusedItem = item;
        paintInfo();
      });
      itemEl.addEventListener('focus', () => {
        focusedItem = item;
        paintInfo();
      });
      list.appendChild(itemEl);
    }
  }

  function paintInfo() {
    info.innerHTML = '';
    if (!meta) {
      info.style.display = 'none';
      return;
    }
    info.style.display = '';
    const subject = focusedItem || values[values.length - 1] || null;
    if (!subject) {
      info.appendChild(el('span', { class: 'muted' },
        'Hover or click an item to see its description.'));
      return;
    }
    const desc = metaDescription(meta, subject);
    info.appendChild(el('strong', {}, subject));
    if (desc) {
      info.appendChild(el('span', { class: 'muted' }, ' — '));
      info.appendChild(el('span', {}, desc));
    } else {
      info.appendChild(el('span', { class: 'muted' }, ' — no description available'));
    }
  }

  search.addEventListener('input', () => {
    filterText = search.value;
    paintList();
  });

  root.appendChild(selectedRow);
  root.appendChild(search);
  root.appendChild(list);
  root.appendChild(info);
  paintSelected();
  paintList();
  paintInfo();

  const wrap = wrapField(def, root, errEl);
  return {
    element: wrap,
    getValue: () => [...values],
    setValue: (v) => {
      values = Array.isArray(v) ? [...v] : [];
      paintSelected();
      paintList();
      paintInfo();
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

// ---- human-readable summary for review screens ----

function isNeutral(v) {
  if (v === null || v === undefined || v === false) return true;
  if (v === 0 || v === '') return true;
  if (Array.isArray(v)) return v.length === 0;
  if (typeof v === 'object') return Object.values(v).every(isNeutral);
  return false;
}

function summaryValue(v) {
  if (typeof v === 'boolean') return el('span', { class: 'summary-bool' }, v ? 'yes' : 'no');
  if (typeof v === 'string' || typeof v === 'number') {
    return el('span', { class: 'summary-scalar' }, String(v));
  }
  if (Array.isArray(v)) {
    if (v.every((x) => typeof x !== 'object' || x === null)) {
      const row = el('span', { class: 'summary-chips' });
      for (const x of v) row.appendChild(el('span', { class: 'chip' }, String(x)));
      return row;
    }
    const wrap = el('div', { class: 'summary-items' });
    v.forEach((item, i) => {
      const block = el('div', { class: 'summary-item' });
      block.appendChild(el('div', { class: 'summary-item-head' }, `#${i + 1}`));
      block.appendChild(summaryValue(item));
      wrap.appendChild(block);
    });
    return wrap;
  }
  if (typeof v === 'object' && v !== null) {
    const dl = el('dl', { class: 'summary summary-nested' });
    appendSummaryEntries(dl, v);
    return dl;
  }
  return el('span', {}, String(v));
}

function appendSummaryEntries(dl, obj) {
  for (const [k, v] of Object.entries(obj)) {
    if (isNeutral(v)) continue;
    dl.appendChild(el('dt', {}, k.replace(/_/g, ' ')));
    const dd = el('dd');
    dd.appendChild(summaryValue(v));
    dl.appendChild(dd);
  }
}

/**
 * renderSummary(json) → readable element for review screens. Neutral values
 * (null / [] / {} / 0 / false / "") are hidden — they are still saved, but the
 * summary shows only what the user actually configured.
 */
function renderSummary(json) {
  const root = el('div', { class: 'summary-root', 'data-role': 'summary' });
  const dl = el('dl', { class: 'summary' });
  appendSummaryEntries(dl, json || {});
  if (dl.children.length === 0) {
    root.appendChild(el('p', { class: 'muted' },
      'All fields use neutral defaults — nothing extra configured.'));
    return root;
  }
  root.appendChild(dl);
  return root;
}

function renderDictOfNumbers(def, initial, onChange, ctx = null) {
  const errEl = makeError();
  let map = { ...(initial || {}) };
  const root = el('div', { class: 'dict-editor' });
  const table = el('table', { class: 'dict' });

  function paint() {
    table.innerHTML = '';
    for (const [k, v] of Object.entries(map)) {
      const row = el('tr');
      row.appendChild(el('td', {}, k));
      const ni = el('input', { type: 'number' });
      ni.value = String(v);
      ni.addEventListener('input', () => {
        map[k] = parseInt(ni.value, 10) || 0;
        onChange({ ...map });
      });
      const td = el('td');
      td.appendChild(ni);
      row.appendChild(td);
      const rmTd = el('td');
      rmTd.appendChild(el('button', {
        type: 'button', class: 'chip-x',
        'data-action': 'remove-key', 'data-key': k,
        onclick: () => {
          delete map[k];
          paint();
          onChange({ ...map });
        },
      }, '×'));
      row.appendChild(rmTd);
      table.appendChild(row);
    }
  }
  paint();
  root.appendChild(table);
  root.appendChild(makeAddKeyRow(def, ctx, () => Object.keys(map), (k) => {
    map[k] = 0;
    paint();
    onChange({ ...map });
  }));
  const wrap = wrapField(def, root, errEl);
  return {
    element: wrap,
    getValue: () => ({ ...map }),
    setValue: (v) => {
      map = { ...(v || {}) };
      paint();
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderDictOfBools(def, initial, onChange, ctx = null) {
  const errEl = makeError();
  let map = { ...(initial || {}) };
  const root = el('div', { class: 'dict-editor' });
  const table = el('table', { class: 'dict' });

  function paint() {
    table.innerHTML = '';
    for (const [k, v] of Object.entries(map)) {
      const row = el('tr');
      row.appendChild(el('td', {}, k));
      const cb = el('input', { type: 'checkbox' });
      cb.checked = !!v;
      cb.addEventListener('change', () => {
        map[k] = cb.checked;
        onChange({ ...map });
      });
      const td = el('td');
      td.appendChild(cb);
      row.appendChild(td);
      const rmTd = el('td');
      rmTd.appendChild(el('button', {
        type: 'button', class: 'chip-x',
        'data-action': 'remove-key', 'data-key': k,
        onclick: () => {
          delete map[k];
          paint();
          onChange({ ...map });
        },
      }, '×'));
      row.appendChild(rmTd);
      table.appendChild(row);
    }
  }
  paint();
  root.appendChild(table);
  root.appendChild(makeAddKeyRow(def, ctx, () => Object.keys(map), (k) => {
    map[k] = true;
    paint();
    onChange({ ...map });
  }));
  const wrap = wrapField(def, root, errEl);
  return {
    element: wrap,
    getValue: () => ({ ...map }),
    setValue: (v) => {
      map = { ...(v || {}) };
      paint();
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderObject(def, initial, onChange, ctx = null) {
  const errEl = makeError();
  const value = { ...(initial || {}) };
  const box = el('div', { class: 'object-fields' });
  const subFields = {};
  for (const [name, subDef] of Object.entries(def.fields || {})) {
    const sub = renderField(
      { id: name, label: subDef.label || name, ...subDef },
      value[name] ?? null,
      (v) => {
        value[name] = v;
        onChange({ ...value });
      },
      ctx,
    );
    subFields[name] = sub;
    box.appendChild(sub.element);
  }
  const wrap = wrapField(def, box, errEl);
  return {
    element: wrap,
    getValue: () => ({ ...value }),
    setValue: (v) => {
      const next = v || {};
      for (const [name, sub] of Object.entries(subFields)) {
        value[name] = next[name] ?? null;
        sub.setValue(next[name] ?? null);
      }
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderListOfObjects(def, initial, onChange, ctx = null) {
  const errEl = makeError();
  let items = Array.isArray(initial) ? initial.map((x) => ({ ...x })) : [];
  const root = el('div', { class: 'list-of-objects' });

  function neutralItem() {
    const out = {};
    for (const [name, subDef] of Object.entries(def.item_fields || {})) {
      out[name] = subNeutral(subDef);
    }
    return out;
  }

  function subNeutral(subDef) {
    const t = Array.isArray(subDef.type) ? subDef.type[0] : subDef.type;
    switch (t) {
      case 'int': case 'float': return 0;
      case 'bool': return false;
      case 'list_of_strings': case 'list_of_objects': return [];
      case 'dict_of_numbers': case 'dict_of_bools': case 'dict_of_objects': case 'object': return {};
      default: return null;
    }
  }

  function paint() {
    root.innerHTML = '';
    items.forEach((item, i) => {
      const card = el('div', { class: 'object-item', 'data-index': String(i) });
      const head = el('div', { class: 'object-item-head' },
        el('strong', {}, `${def.item_label || 'Item'} ${i + 1}`));
      head.appendChild(el('button', {
        type: 'button', class: 'chip-x',
        'data-action': 'remove-item', 'data-index': String(i),
        onclick: () => {
          items.splice(i, 1);
          paint();
          onChange(items.map((x) => ({ ...x })));
        },
      }, '×'));
      card.appendChild(head);
      for (const [name, subDef] of Object.entries(def.item_fields || {})) {
        const sub = renderField(
          { id: name, label: subDef.label || name, ...subDef },
          item[name] ?? null,
          (v) => {
            item[name] = v;
            onChange(items.map((x) => ({ ...x })));
          },
          ctx,
        );
        card.appendChild(sub.element);
      }
      root.appendChild(card);
    });
    root.appendChild(el('button', {
      type: 'button', 'data-action': 'add-item',
      onclick: () => {
        items.push(neutralItem());
        paint();
        onChange(items.map((x) => ({ ...x })));
      },
    }, `+ Add ${def.item_label || 'item'}`));
  }
  paint();
  const wrap = wrapField(def, root, errEl);
  return {
    element: wrap,
    getValue: () => items.map((x) => ({ ...x })),
    setValue: (v) => {
      items = Array.isArray(v) ? v.map((x) => ({ ...x })) : [];
      paint();
    },
    setError: (m) => setErr(errEl, wrap, m),
  };
}

function renderDictOfObjects(def, initial, onChange, ctx = null) {
  const errEl = makeError();
  let map = {};
  for (const [k, v] of Object.entries(initial || {})) map[k] = { ...v };
  const root = el('div', { class: 'dict-editor' });
  const body = el('div');

  function neutralItem() {
    const out = {};
    for (const [name, subDef] of Object.entries(def.item_fields || {})) {
      const t = Array.isArray(subDef.type) ? subDef.type[0] : subDef.type;
      out[name] = t === 'int' || t === 'float' ? 0 : t === 'bool' ? false : null;
    }
    return out;
  }

  function paint() {
    body.innerHTML = '';
    for (const [k, item] of Object.entries(map)) {
      const card = el('div', { class: 'object-item', 'data-key': k });
      const head = el('div', { class: 'object-item-head' }, el('strong', {}, k));
      head.appendChild(el('button', {
        type: 'button', class: 'chip-x',
        'data-action': 'remove-key', 'data-key': k,
        onclick: () => {
          delete map[k];
          paint();
          emit();
        },
      }, '×'));
      card.appendChild(head);
      for (const [name, subDef] of Object.entries(def.item_fields || {})) {
        const sub = renderField(
          { id: name, label: subDef.label || name, ...subDef },
          item[name] ?? null,
          (v) => {
            item[name] = v;
            emit();
          },
          ctx,
        );
        card.appendChild(sub.element);
      }

__fm.define('schemas/_dsl.js', async () => {
/**
 * Supported field types:
 *   "string", "longtext", "int", "float", "bool",
 *   "enum"            (requires options: string[])
 *   "list_of_strings"
 *   "list_of_objects" (optional item_fields: {name: def} validated per item)
 *   "dict_of_numbers"
 *   "dict_of_bools"
 *   "dict_of_objects" (optional item_fields: {name: def} validated per value)
 *   "object"          (requires fields: {name: def}; validated recursively)
 *   "formula"         (validated as string at this layer)
 *   Array form: ["string", "list_of_strings", "null"] — union; valid if any member validates.
 */

function neutralDefault(def) {
  const t = Array.isArray(def.type) ? def.type[0] : def.type;
  switch (t) {
    case 'string':
    case 'longtext':
    case 'formula':
    case 'enum':
      return null;
    case 'int':
    case 'float':
      return 0;
    case 'bool':
      return false;
    case 'list_of_strings':
    case 'list_of_objects':
      return [];
    case 'dict_of_numbers':
    case 'dict_of_bools':
    case 'dict_of_objects':
      return {};
    case 'object': {
      const out = {};
      for (const [name, sub] of Object.entries(def.fields || {})) {
        out[name] = neutralDefault(sub);
      }
      return out;
    }
    case 'null':
      return null;
    default:
      return null;
  }
}

function validateSubfields(fields, obj) {
  for (const [name, sub] of Object.entries(fields)) {
    const r = validateField(sub, obj[name]);
    if (!r.valid) return { valid: false, error: `${name}: ${r.error}` };
  }
  return { valid: true, error: null };
}

function validateSingle(type, def, value) {
  if (value === null || value === undefined) {
    if (def.required) return { valid: false, error: 'required' };
    return { valid: type === 'null' || !def.required, error: null };
  }
  switch (type) {
    case 'null':
      return value === null
        ? { valid: true, error: null }
        : { valid: false, error: 'expected null' };
    case 'string':
    case 'longtext':
    case 'formula':
      return typeof value === 'string'
        ? { valid: true, error: null }
        : { valid: false, error: 'expected string' };
    case 'enum':
      return def.options?.includes(value)
        ? { valid: true, error: null }
        : { valid: false, error: `expected one of ${JSON.stringify(def.options)}` };
    case 'int':
      if (typeof value !== 'number' || !Number.isInteger(value)) {
        return { valid: false, error: 'expected integer' };
      }
      if (def.min != null && value < def.min) return { valid: false, error: `min ${def.min}` };
      if (def.max != null && value > def.max) return { valid: false, error: `max ${def.max}` };
      return { valid: true, error: null };
    case 'float':
      if (typeof value !== 'number' || Number.isNaN(value)) {
        return { valid: false, error: 'expected number' };
      }
      if (def.min != null && value < def.min) return { valid: false, error: `min ${def.min}` };
      if (def.max != null && value > def.max) return { valid: false, error: `max ${def.max}` };
      return { valid: true, error: null };
    case 'bool':
      return typeof value === 'boolean'
        ? { valid: true, error: null }
        : { valid: false, error: 'expected boolean' };
    case 'list_of_strings':
      if (!Array.isArray(value)) return { valid: false, error: 'expected array' };
      for (const item of value) {
        if (typeof item !== 'string') return { valid: false, error: 'expected string items' };
      }
      return { valid: true, error: null };
    case 'list_of_objects':
      if (!Array.isArray(value)) return { valid: false, error: 'expected array' };
      for (const item of value) {
        if (typeof item !== 'object' || item === null || Array.isArray(item)) {
          return { valid: false, error: 'expected object items' };
        }
        if (def.item_fields) {
          const r = validateSubfields(def.item_fields, item);
          if (!r.valid) return r;
        }
      }
      return { valid: true, error: null };
    case 'dict_of_numbers':
      if (typeof value !== 'object' || value === null || Array.isArray(value)) {
        return { valid: false, error: 'expected object' };
      }
      for (const v of Object.values(value)) {
        if (typeof v !== 'number') return { valid: false, error: 'expected number values' };
      }
      return { valid: true, error: null };
    case 'dict_of_bools':
      if (typeof value !== 'object' || value === null || Array.isArray(value)) {
        return { valid: false, error: 'expected object' };
      }
      for (const v of Object.values(value)) {
        if (typeof v !== 'boolean') return { valid: false, error: 'expected boolean values' };
      }
      return { valid: true, error: null };
    case 'dict_of_objects':
      if (typeof value !== 'object' || value === null || Array.isArray(value)) {
        return { valid: false, error: 'expected object' };
      }
      for (const v of Object.values(value)) {
        if (typeof v !== 'object' || v === null || Array.isArray(v)) {
          return { valid: false, error: 'expected object values' };
        }
        if (def.item_fields) {
          const r = validateSubfields(def.item_fields, v);
          if (!r.valid) return r;
        }
      }
      return { valid: true, error: null };
    case 'object': {
      if (typeof value !== 'object' || value === null || Array.isArray(value)) {
        return { valid: false, error: 'expected object' };
      }
      return validateSubfields(def.fields || {}, value);
    }
    default:
      return { valid: false, error: `unknown type ${type}` };
  }
}

function validateField(def, value) {
  const types = Array.isArray(def.type) ? def.type : [def.type];
  if (value === null || value === undefined) {
    if (def.required) return { valid: false, error: 'required' };
    return { valid: true, error: null };
  }
  let lastError = null;
  for (const t of types) {
    const r = validateSingle(t, def, value);
    if (r.valid) return r;
    lastError = r.error;
  }
  return { valid: false, error: lastError || 'no matching type' };
}

return { neutralDefault, validateField };
});

__fm.define('lib/validator.js', async () => {
const { validateField } = __fm.get('schemas/_dsl.js');

function validateEntry(entry, schema, ctx) {
  const errors = [];
  const warnings = [];
  const migrations = [];

  // 1. Field validation
  for (const [name, def] of Object.entries(schema.fields)) {
    if (!(name in entry)) {
      if (def.required) {
        errors.push({ field: name, error: 'required', rule: null });
      }
      continue;
    }
    const r = validateField(def, entry[name]);
    if (!r.valid) errors.push({ field: name, error: r.error, rule: null });
  }

  // 2. Legacy field detection
  if (schema.legacy) {
    for (const [legacyName, info] of Object.entries(schema.legacy)) {
      if (legacyName in entry) {
        migrations.push({ from: legacyName, to: info.migrates_to });
      }
    }
  }

  // 3. Rules
  for (const rule of schema.rules || []) {
    let passed = true;
    try {
      passed = rule.check(entry, ctx);
    } catch {
      passed = false;
    }
    if (!passed) {
      const out = { rule: rule.id, field: rule.field || null, message: rule.message };
      if (rule.severity === 'error') errors.push(out);
      else warnings.push(out);
    }
  }

  return { errors, warnings, migrations };
}

function applyMigrations(entry, schema) {
  if (!schema.legacy) return { ...entry };
  const out = { ...entry };
  for (const [legacyName, info] of Object.entries(schema.legacy)) {
    if (legacyName in out) {
      const newVal = info.as(out[legacyName]);
      const target = info.migrates_to;
      if (Array.isArray(out[target])) {
        out[target] = [...out[target], ...(Array.isArray(newVal) ? newVal : [newVal])];
      } else {
        out[target] = newVal;
      }
      delete out[legacyName];
    }
  }
  return out;
}

return { validateEntry, applyMigrations };
});

__fm.define('lib/fs.js', async () => {
/**
 * Common fs interface:
 *   - openRoot()                  → must be called once (browser only)
 *   - readJSON(relPath)           → parsed JSON or null
 *   - writeJSON(relPath, data)
 *   - listDir(relDir)             → [filename, ...]
 *   - mergeAndWrite(relPath, entry, { key, wrapper }) → append-or-replace by key.
 *     Without wrapper the file root is an array. With wrapper (e.g. "items",
 *     "building_types") the root is an object whose <wrapper> key holds the
 *     array; sibling root keys are preserved.
 */

async function mergeIntoFile(fsLike, p, entry, { key, wrapper }) {
  if (wrapper) {
    const root = (await fsLike.readJSON(p)) || { [wrapper]: [] };
    if (Array.isArray(root) || typeof root !== 'object' || root === null) {
      throw new Error(`mergeAndWrite expects object root with "${wrapper}" at ${p}`);
    }
    const arr = Array.isArray(root[wrapper]) ? [...root[wrapper]] : [];
    const idx = arr.findIndex((e) => e && e[key] === entry[key]);
    if (idx >= 0) arr[idx] = entry;
    else arr.push(entry);
    await fsLike.writeJSON(p, { ...root, [wrapper]: arr });
    return;
  }
  let arr = (await fsLike.readJSON(p)) || [];
  if (!Array.isArray(arr)) throw new Error(`mergeAndWrite expects array root at ${p}`);
  const idx = arr.findIndex((e) => e && e[key] === entry[key]);
  if (idx >= 0) arr[idx] = entry;
  else arr = [...arr, entry];
  await fsLike.writeJSON(p, arr);
}

/**
 * Daily story extensions: { daily_story_extensions: [ { building_id,
 * profession_id, merge_mode, daily_stories: [...] } ] }. Stories are upserted
 * by id inside the entry matching building_id+profession_id (the same merge
 * the game performs at load time).
 */
async function mergeDailyStoryExtension(fsLike, p, { building_id, profession_id, story }) {
  const root = (await fsLike.readJSON(p)) || { daily_story_extensions: [] };
  const entries = Array.isArray(root.daily_story_extensions)
    ? [...root.daily_story_extensions]
    : [];
  let entry = entries.find(
    (e) => e && e.building_id === building_id && e.profession_id === profession_id,
  );
  if (!entry) {
    entry = { building_id, profession_id, merge_mode: 'upsert', daily_stories: [] };
    entries.push(entry);
  }
  const stories = Array.isArray(entry.daily_stories) ? [...entry.daily_stories] : [];
  const idx = stories.findIndex((s) => s && s.id === story.id);
  if (idx >= 0) stories[idx] = story;
  else stories.push(story);
  entry.daily_stories = stories;
  await fsLike.writeJSON(p, { ...root, daily_story_extensions: entries });
}

function createMemoryFS(initial = {}) {
  const store = new Map(Object.entries(initial));
  return {
    async openRoot() {},
    async readJSON(p) {
      return store.has(p) ? JSON.parse(JSON.stringify(store.get(p))) : null;
    },
    async writeJSON(p, data) {
      store.set(p, JSON.parse(JSON.stringify(data)));
    },
    async listDir(prefix) {
      const out = [];
      for (const key of store.keys()) {
        if (!key.startsWith(prefix + '/')) continue;
        const rest = key.slice(prefix.length + 1);
        if (!rest.includes('/')) out.push(rest);
      }
      return out;
    },
    async mergeAndWrite(p, entry, opts) {
      await mergeIntoFile(this, p, entry, opts);
    },
  };
}

function createFSAFS(rootHandle) {
  async function walk(parts) {
    let h = rootHandle;
    for (let i = 0; i < parts.length - 1; i++) {
      h = await h.getDirectoryHandle(parts[i], { create: true });
    }
    return h;
  }
  return {
    async openRoot() {
      // already supplied via rootHandle
    },
    async readJSON(p) {
      const parts = p.split('/');
      try {
        const dir = await walk(parts);
        const fh = await dir.getFileHandle(parts.at(-1));
        const file = await fh.getFile();
        const txt = await file.text();
        return JSON.parse(txt);
      } catch {
        return null;
      }
    },
    async writeJSON(p, data) {
      const parts = p.split('/');
      const dir = await walk(parts);
      const fh = await dir.getFileHandle(parts.at(-1), { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(data, null, 2) + '\n');
      await w.close();
    },
    async listDir(prefix) {
      const parts = prefix.split('/').filter(Boolean);
      let dir = rootHandle;
      for (const p of parts) dir = await dir.getDirectoryHandle(p);
      const out = [];
      for await (const [name, entry] of dir.entries()) {
        if (entry.kind === 'file') out.push(name);
      }
      return out;
    },
    async mergeAndWrite(p, entry, opts) {
      await mergeIntoFile(this, p, entry, opts);
    },
  };
}

return { mergeDailyStoryExtension, createMemoryFS, createFSAFS };
});

__fm.define('schemas/_rules.js', async () => {
// Shared rule helpers for content schemas.

/** true when every string in list exists in the catalog Set (missing catalog passes). */
function allIn(catalogSet, list) {
  if (!catalogSet) return true;
  return (list || []).every((x) => typeof x !== 'string' || catalogSet.has(x));
}

/** Normalizes string-or-list-or-null to a list. */
function asList(v) {
  if (v == null) return [];
  return Array.isArray(v) ? v : [v];
}

const OUTCOMES = ['failure', 'mediocre', 'success', 'critical_success'];

return { allIn, asList, OUTCOMES };
});

__fm.define('recipes/_helpers.js', async () => {
// Shared helpers for recipe build() functions.

/** "Healing Brew!" → "healing_brew" — safe id slug. */
function slug(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}

const OUTCOMES = ['failure', 'mediocre', 'success', 'critical_success'];

/** Full neutral consequence block (standardization rule: all keys present). */
function neutralConsequence() {
  return {
    energy: 0, health: 0, joy: 0, rebelliousness: 0, romance: 0,
    relationship: 0, reputation: 0, libido: 0, obedience: 0,
    trait_chance: [], trait_remove_chance: [], give_item: null,
  };
}

function neutralConsequences() {
  return Object.fromEntries(OUTCOMES.map((o) => [o, neutralConsequence()]));
}

/** Neutral event-effect payload (flat shape, no success/failure branches). */
function neutralEffect() {
  return {
    money: 0, reputation: 0, custom: null, event_flags: {},
    item_id: null, loot_rolls: 0, skill_modifiers: {},
  };
}

/** Shared "pick a building, then one of its professions" steps. */
function buildingProfessionSteps() {
  return [
    {
      id: 'building',
      type: 'enum',
      label: 'Building',
      required: true,
      options: (ctx) => Object.keys(ctx.catalogs?.meta?.building_professions || {}).sort(),
      option_descriptions: (ctx) => Object.fromEntries(
        Object.entries(ctx.catalogs?.meta?.building_professions || {})
          .map(([id, b]) => [id, b.name]),
      ),
    },
    {
      id: 'profession',
      type: 'enum',
      label: 'Profession (job)',
      required: true,
      options: (ctx, a) =>
        (ctx.catalogs?.meta?.building_professions?.[a.building]?.professions || [])
          .map((p) => p.id),
      option_descriptions: (ctx, a) => Object.fromEntries(
        (ctx.catalogs?.meta?.building_professions?.[a.building]?.professions || [])
          .map((p) => [p.id, p.description ? `${p.name} — ${p.description}` : p.name]),
      ),
    },
  ];
}

return { slug, OUTCOMES, neutralConsequence, neutralConsequences, neutralEffect, buildingProfessionSteps };
});
