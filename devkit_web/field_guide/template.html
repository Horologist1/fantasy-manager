<title>Fantasy Manager Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a guild ledger. Sticky left index of chapters, one reading column, data tables as ledgers. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1d2422;
  --muted: #56615d;
  --line: #d6dbd7;
  --accent: #8a5a12;
  --accent-soft: #f3e6cf;
  --teal: #1f5f5b;
  --teal-soft: #dcebe8;
  --ok: #2d6a3e;
  --ok-soft: #dcefe1;
  --warn: #8a4b0f;
  --warn-soft: #f8e4cf;
  --none: #7a2e2e;
  --none-soft: #f5dede;
  --code-bg: #eef0ec;
  --font-display: "Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --panel: #1c2320; --ink: #e6ebe7; --muted: #a3aea9; --line: #33403b;
    --accent: #e0aa55; --accent-soft: #3a2e1c; --teal: #7cc2ba; --teal-soft: #1f3532;
    --ok: #86cf98; --ok-soft: #1f3526; --warn: #f0b072; --warn-soft: #3d2b19;
    --none: #f09b9b; --none-soft: #3e2222; --code-bg: #232b28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1c2320; --ink: #e6ebe7; --muted: #a3aea9; --line: #33403b;
  --accent: #e0aa55; --accent-soft: #3a2e1c; --teal: #7cc2ba; --teal-soft: #1f3532;
  --ok: #86cf98; --ok-soft: #1f3526; --warn: #f0b072; --warn-soft: #3d2b19;
  --none: #f09b9b; --none-soft: #3e2222; --code-bg: #232b28; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px; }
header.top { padding-block: 28px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
header.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 44px); line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); font-size: 17px; max-width: 70ch; }
.meta { font-size: 14px; color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 6px; }
.tab { font: 600 16px var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 9px 16px; border-radius: 6px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--teal); color: var(--bg); border-color: var(--teal); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; padding-top: 26px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; max-height: calc(100vh - 24px); overflow-y: auto; font-size: 15px; }
nav.toc .toc-title { font-family: var(--font-display); font-size: 15px; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
nav.toc a { display: block; padding: 5px 10px; color: var(--ink); text-decoration: none; border-left: 2px solid var(--line); }
nav.toc a:hover { border-left-color: var(--accent); color: var(--accent); }
nav.toc a.sub { padding-left: 22px; font-size: 14px; color: var(--muted); }
main { min-width: 0; }
section.chapter { padding-bottom: 18px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; margin: 34px 0 10px; line-height: 1.2; text-wrap: balance; }
h2:first-child { margin-top: 0; }
h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 26px 0 8px; color: var(--teal); }
p, li { max-width: 72ch; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
code, .mono { font-family: var(--font-mono); font-size: 14.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; word-break: break-word; }
pre { font-family: var(--font-mono); font-size: 14.5px; background: var(--code-bg); padding: 14px 16px; border-radius: 6px; overflow-x: auto; line-height: 1.55; }
.note { border: 1px solid var(--line); background: var(--panel); padding: 12px 16px; border-radius: 6px; margin: 14px 0; max-width: 78ch; }
.note.fix { border-color: var(--accent); background: var(--accent-soft); }
.note strong { color: var(--accent); }
.tw { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-body); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--panel); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font: 600 13.5px var(--font-body); padding: 1px 9px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.full { background: var(--ok-soft); color: var(--ok); }
.pill.part { background: var(--teal-soft); color: var(--teal); }
.pill.zero { background: var(--warn-soft); color: var(--warn); }
.pill.tag { background: var(--code-bg); color: var(--muted); }
.pill.nsfw { background: var(--none-soft); color: var(--none); }
.pill.rel { background: var(--accent-soft); color: var(--accent); }
.fb { color: var(--muted); font-size: 15px; }
.fb b { color: var(--ink); font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 12px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.controls label { font-size: 15px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
input[type="search"], select { font: 16px var(--font-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); min-width: 0; }
input[type="search"] { flex: 1 1 220px; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--teal); }
.count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.subtab { font: 500 15px var(--font-body); border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 5px; cursor: pointer; }
.subtab[aria-selected="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.stat .k { font-size: 14px; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat .v small { font-family: var(--font-body); font-size: 15px; color: var(--muted); }
.bar { height: 6px; background: var(--warn-soft); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.grid-cov { font-size: 13.5px; }
.grid-cov td, .grid-cov th { padding: 5px 6px; text-align: center; }
.grid-cov th.f { writing-mode: vertical-rl; transform: rotate(180deg); text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 13.5px; padding: 8px 4px; }
.grid-cov td.sk { text-align: left; font-weight: 600; font-size: 15px; white-space: nowrap; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; }
.dot.both { background: var(--ok); }
.dot.ok { background: var(--teal); opacity: .55; }
.dot.no { background: var(--warn-soft); border: 1px solid var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted); margin: 6px 0; }
details.row { border-bottom: 1px solid var(--line); }
details.row > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
details.row > summary::-webkit-details-marker { display: none; }
details.row[open] > summary { background: var(--code-bg); }
details.row .body { padding: 8px 14px 14px; font-size: 15.5px; }
.sid { font-family: var(--font-mono); font-size: 14.5px; word-break: break-all; }
.sub-line { font-size: 14px; color: var(--muted); }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.group-h { font-family: var(--font-display); font-size: 19px; padding: 12px 12px 6px; color: var(--teal); background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; align-items: baseline; }
.kv .k { color: var(--muted); font-size: 14px; }
.folders { font-size: 14px; color: var(--muted); }
.more { margin: 12px 0; font: 600 15px var(--font-body); padding: 8px 14px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.formula { display: grid; gap: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 18px; color: var(--muted); }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 16px; }
  nav.toc { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; }
  nav.toc .toc-title { width: 100%; }
  nav.toc a { border-left: 0; border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; }
  nav.toc a.sub { display: none; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .subtab, nav.toc a { transition: background .15s, color .15s, border-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Fantasy Manager Field Guide</h1>
    <p>How the game works, the formulas behind it, and every image the game looks for. Checked against the code of version 0.9.6.2t1.</p>
    <div class="tabs" role="tablist" aria-label="Guide sections">
      <button class="tab" role="tab" id="tab-play" aria-selected="true" data-tab="play">How to play</button>
      <button class="tab" role="tab" id="tab-ref" aria-selected="false" data-tab="ref">Formulas &amp; data</button>
      <button class="tab" role="tab" id="tab-img" aria-selected="false" data-tab="img">Images &amp; modding</button>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="On this page"></nav>
    <main>
      <div class="panel" id="panel-play" data-panel="play">
<!--PLAY-->
      </div>
      <div class="panel" id="panel-ref" data-panel="ref" hidden>
<!--REF-->
      </div>
      <div class="panel" id="panel-img" data-panel="img" hidden>
<!--IMG-->
      </div>
    </main>
  </div>
</div>

<script id="img-data" type="application/json">/*DATA*/</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("img-data").textContent);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* ---------- tabs + toc ---------- */
  const tabs = [...document.querySelectorAll(".tab")];
  const toc = document.getElementById("toc");
  function buildToc(name) {
    const panel = document.querySelector(`[data-panel="${name}"]`);
    let html = '<div class="toc-title">On this page</div>';
    panel.querySelectorAll("h2[id], h3[id]").forEach(h => {
      if (h.closest("[data-sub]")) return;
      html += `<a href="#${h.id}" class="${h.tagName === "H3" ? "sub" : ""}">${esc(h.textContent)}</a>`;
    });
    toc.innerHTML = html;
  }
  function show(name, push) {
    tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.panel !== name);
    buildToc(name);
    try { localStorage.setItem("fm-guide-tab", name); } catch (e) {}
    if (push) { try { history.replaceState(null, "", "#" + name); } catch (e) {} }
  }
  tabs.forEach(t => t.addEventListener("click", () => { show(t.dataset.tab, true); window.scrollTo({ top: 0 }); }));
  toc.addEventListener("click", e => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault();
    const el = document.getElementById(a.getAttribute("href").slice(1));
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  /* ---------- skills ---------- */
  function skills() {
    document.getElementById("skills-grid").innerHTML =
      '<div class="tw"><table><thead><tr><th>Skill</th><th>Success file names</th><th>Failure file names</th></tr></thead><tbody>' +
      D.skills.map(s => `<tr><td><b>${esc(s.skill)}</b>${s.nsfw ? ' <span class="pill nsfw">NSFW</span>' : ""}</td>
        <td>${s.files.map(f => `<code>${esc(f)}</code>`).join(" ")}</td>
        <td>${s.files.map(f => `<code>${esc(f)}_failure</code>`).join(" ")}</td></tr>`).join("") +
      "</tbody></table></div>";
  }

  /* ---------- interactions ---------- */
  function interactions() {
    const cats = {};
    D.interactions.forEach(x => (cats[x.cat] = cats[x.cat] || []).push(x));
    let h = "";
    Object.entries(cats).forEach(([cat, xs]) => {
      h += `<div class="group-h">${esc(cat)}</div>`;
      xs.forEach(x => {
        h += `<details class="row"><summary><div><span class="sid">${esc(x.name)}</span> ${x.lvl ? `<span class="pill tag">Level ${x.lvl}</span>` : ""} ${x.nsfw ? '<span class="pill nsfw">NSFW</span>' : ""}
          <div class="sub-line">if missing → <b>${esc(x.fb)}</b> → profile</div></div></summary>
          <div class="body kv"><span class="k">Used by</span><span>${x.ids.map(i => `<code>${esc(i)}</code>`).join(" ")}</span>
          <span class="k">Tried in order</span><span class="fb"><code>${esc(x.name)}_lord</code> / <code>${esc(x.name)}_lady</code> → <code>${esc(x.name)}_male</code> / <code>_female</code> → <code>${esc(x.name)}</code> → ${esc(x.fb)} → profile</span></div></details>`;
      });
    });
    document.getElementById("inter-list").innerHTML = h;
  }

  /* ---------- training ---------- */
  function training() {
    const skillFile = { Service: "service", Striptease: "strip", Homo: "les / gay", Special: "special" };
    document.getElementById("train-list").innerHTML =
      D.training.map(t => `<tr><td><span class="mono">${esc(t.name)}</span></td><td>${esc(t.skill)}</td><td class="fb"><b>${esc(skillFile[t.skill] || String(t.skill).toLowerCase())}</b> → profile</td></tr>`).join("") +
      D.training_branches.map(t => `<tr><td><span class="mono">${esc(t.name)}</span></td><td>${esc(t.kind)}</td><td class="fb">its own image only</td></tr>`).join("");
  }

  /* ---------- stories ---------- */
  const sb = document.getElementById("st-building"), sp = document.getElementById("st-prof"),
        sq = document.getElementById("st-q"), sr = document.getElementById("st-rel");
  const buildings = [...new Set(D.stories.map(s => s.b))];
  sb.innerHTML = '<option value="">All buildings</option>' + buildings.map(b => `<option>${esc(b)}</option>`).join("");
  function fillProf() {
    const ps = [...new Set(D.stories.filter(s => !sb.value || s.b === sb.value).map(s => s.p))];
    sp.innerHTML = '<option value="">All professions</option>' + ps.map(p => `<option>${esc(p)}</option>`).join("");
  }
  let stLimit = 80;
  function stories() {
    const q = sq.value.trim().toLowerCase();
    const rows = D.stories.filter(s =>
      (!sb.value || s.b === sb.value) && (!sp.value || s.p === sp.value) &&
      (sr.value === "" || (sr.value === "rel" ? s.rel : !s.rel)) &&
      (!q || (s.id + " " + s.s + " " + s.f + " " + s.skills.join(" ")).toLowerCase().includes(q)));
    document.getElementById("st-count").textContent = rows.length + " stories";
    let h = "", last = "";
    rows.slice(0, stLimit).forEach(s => {
      if (s.b + "|" + s.p !== last) { h += `<div class="group-h">${esc(s.b)} · ${esc(s.p)}</div>`; last = s.b + "|" + s.p; }
      const chain = s.fb.length ? s.fb.join(" or ") : "profession skill";
      const tags = s.tags.map(t => `<span class="pill tag">${esc(t)}</span>`).join(" ") + (s.rel ? ' <span class="pill rel">relationship</span>' : "");
      h += `<details class="row"><summary><div><span class="sid">${esc(s.id)}</span> ${tags}
        <div class="sub-line">${s.s ? `<span class="mono">${esc(s.s)}</span>` : "no image of its own"} → <b>${esc(chain)}</b> → profile</div></div></summary>
        <div class="body kv">
          ${s.s ? `<span class="k">Success</span><span><code>${esc(s.s)}</code></span>
          <span class="k">Failure</span><span>${s.f ? `<code>${esc(s.f)}</code>` : "uses the success image"}</span>` : ""}
          <span class="k">Skill roll</span><span>${s.skills.length ? s.skills.map(esc).join(", ") : "—"}</span>
          <span class="k">If missing</span><span class="fb">${s.s ? "failure → success image of this story → " : ""}<b>${esc(chain)}</b> (<code>_failure</code> on a failed roll) → profile</span>
        </div></details>`;
    });
    if (!rows.length) h = '<div class="empty">No story matches these filters.</div>';
    document.getElementById("st-list").innerHTML = h;
    const more = document.getElementById("st-more");
    more.hidden = rows.length <= stLimit;
    more.textContent = `Show ${Math.min(120, rows.length - stLimit)} more`;
  }
  [sb, sp, sq, sr].forEach(el => el.addEventListener("input", () => { if (el === sb) fillProf(); stLimit = 80; stories(); }));
  document.getElementById("st-more").addEventListener("click", () => { stLimit += 120; stories(); });

  /* ---------- events ---------- */
  const ef = document.getElementById("ev-file"), eq = document.getElementById("ev-q");
  ef.innerHTML = '<option value="">All event files</option>' + [...new Set(D.events.map(e => e.file))].map(f => `<option>${esc(f)}</option>`).join("");
  let evLimit = 60;
  function events() {
    const q = eq.value.trim().toLowerCase();
    const rows = D.events.filter(e => (!ef.value || e.file === ef.value) &&
      (!q || (e.id + " " + e.imgs.map(i => i.n).join(" ")).toLowerCase().includes(q)));
    document.getElementById("ev-count").textContent = rows.length + " events";
    let h = "", last = "";
    rows.slice(0, evLimit).forEach(e => {
      if (e.file !== last) { h += `<div class="group-h">${esc(e.file)}</div>`; last = e.file; }
      const worker = e.sel && e.sel !== "none";
      const fbTxt = worker && e.conds.length
        ? `acting worker's folder → skill of the chosen option (${e.conds.map(esc).join(", ")}) → <code>images/events/</code> → generic_success / generic_failure / event_bg`
        : "<code>images/events/</code> → generic_success / generic_failure / event_bg";
      h += `<details class="row"><summary><div><span class="sid">${esc(e.id)}</span> ${e.sel ? `<span class="pill tag">worker: ${esc(e.sel)}</span>` : ""}
        <div class="sub-line">${e.imgs.map(i => `<span class="mono">${esc(i.n)}</span>`).join(" · ")}</div></div></summary>
        <div class="body"><div class="tw"><table><thead><tr><th>Slot</th><th>Image name</th></tr></thead><tbody>
        ${e.imgs.map(i => `<tr><td>${esc(i.k)}</td><td><code>${esc(i.n)}</code></td></tr>`).join("")}
        </tbody></table></div><div class="fb">If missing → ${fbTxt}</div></div></details>`;
    });
    if (!rows.length) h = '<div class="empty">No event matches these filters.</div>';
    document.getElementById("ev-list").innerHTML = h;
    const more = document.getElementById("ev-more");
    more.hidden = rows.length <= evLimit;
    more.textContent = `Show ${Math.min(100, rows.length - evLimit)} more`;
  }
  [ef, eq].forEach(el => el.addEventListener("input", () => { evLimit = 60; events(); }));
  document.getElementById("ev-more").addEventListener("click", () => { evLimit += 100; events(); });

  /* ---------- image sub-tabs ---------- */
  const subs = [...document.querySelectorAll(".subtab")];
  subs.forEach(b => b.addEventListener("click", () => {
    subs.forEach(x => x.setAttribute("aria-selected", String(x === b)));
    document.querySelectorAll("[data-sub]").forEach(p => p.hidden = p.dataset.sub !== b.dataset.target);
  }));

  skills(); interactions(); training(); fillProf(); stories(); events();

  let start = "play";
  const hash = (location.hash || "").slice(1);
  if (["play", "ref", "img"].includes(hash)) start = hash;
  else { try { const s = localStorage.getItem("fm-guide-tab"); if (s && ["play", "ref", "img"].includes(s)) start = s; } catch (e) {} }
  show(start, false);
})();
</script>
