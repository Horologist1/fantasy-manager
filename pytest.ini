[pytest]
# Los tests de runtime (test_*_runtime.py) copian el proyecto entero en un
# tmp_path por cada test. Con la politica por defecto, pytest conserva las 3
# ultimas corridas completas: medido el 2026-09-29, 1,58 GB en %TEMP%.
#
# "failed" conserva solo los directorios de los tests que fallan, que son los
# unicos que hay que mirar. Los que pasan se borran al terminar.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
